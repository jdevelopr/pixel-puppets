/* ============================================================================
   PLAY TOGETHER — two computers, one stage, via PeerJS data channels.

   The HOST runs the whole show exactly as in single-player: physics, mic,
   recording, playback, export — nothing about the capture model changes.
   The GUEST is a remote controller with a mirrored view:

     guest --> host   {a:"join", spec}       my character (from MY roster)
                      {a:"k", m, talk}       held-direction bitmask + talk key
                                             (sent on change + as keepalive)
                      {a:"use"} {a:"expr"}   one-shot actions
                      {a:"bub", text}        typed speech bubble
                      {a:"need", id}         please describe this entity
     host --> guest   {a:"init"|"ent" ...}   entity descriptors (spec ids only)
                      {a:"s", ...}           ~20Hz state snapshot: positions,
                                             jaws, expressions, vehicles,
                                             bubbles, weather, wipe, scene,
                                             REC flag, music-cue name, or
                                             busy:1 while the host is in a
                                             menu (guest shows a curtain)
                      {a:"fx", ...}          ability/prop effect triggers
                                             (particles re-spawn locally)

   Audio never crosses the wire: the players share a room, so the HOST mic
   records both voices; the guest's talk key only marks WHO is speaking.
   Guest inputs land in the host's ordinary `held` set under virtual G_*
   codes with a virtual "GUEST" scheme, so driving, talking, recording and
   playback need no special cases. Room codes are 4 characters, unambiguous
   alphabet. PeerJS loads from its CDN on first use (skipped if a Peer
   implementation is already present).
   ==========================================================================*/

const NET_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const NET_PREFIX = "pixpup-";
SCHEMES.GUEST = { left: "G_LEFT", right: "G_RIGHT", up: "G_UP", down: "G_DOWN",
                  talk: "G_TALK", use: "G_USE", label: "GUEST" };

const net = {
  peer: null, conn: null,
  hosting: false, guesting: false,
  code: null, screen: null, status: "",
  guestPuppetId: null,          // host: the guest's puppet id
  myId: null, mySpec: null,     // guest: my puppet
  mirror: { puppets: [], props: [], effects: [], bubbles: [], weather: "none",
            wipeAt: -1e9, backdrop: 0 },
  targets: new Map(),           // guest: id -> latest snapshot fields
  pendingNeed: new Set(),
  hostBusy: false, hostRec: false, cueName: null,
  lastSnapAt: 0, lastRecvAt: 0, keepAcc: 0, lastMask: -1, lastTalk: false
};

function loadPeerJs() {
  return new Promise((res, rej) => {
    if (window.Peer) return res();
    const s = document.createElement("script");
    s.src = "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
    s.onload = () => window.Peer ? res() : rej(new Error("peerjs missing"));
    s.onerror = () => rej(new Error("peerjs load failed"));
    document.head.appendChild(s);
  });
}
function netSend(msg) {
  if (net.conn && net.conn.open !== false) { try { net.conn.send(msg); } catch (e) {} }
}
function makeRoomCode() {
  let c = "";
  for (let i = 0; i < 4; i++) c += NET_ALPHABET[Math.floor(Math.random() * NET_ALPHABET.length)];
  return c;
}

function enterNet() { mode = "net"; net.screen = "menu"; net.status = ""; }
function leaveNet(toTitle) {
  netSend({ a: "bye" });
  if (net.peer) { try { net.peer.destroy(); } catch (e) {} }
  if (net.hosting && net.guestPuppetId) {
    const p = findEntity(live, net.guestPuppetId);
    if (p) p.scheme = null;
  }
  for (const c of ["G_LEFT", "G_RIGHT", "G_UP", "G_DOWN", "G_TALK"]) held.delete(c);
  talkStack = talkStack.filter(n => n !== "GUEST");
  net.peer = net.conn = null;
  net.hosting = net.guesting = false;
  net.code = net.screen = null;
  net.guestPuppetId = net.myId = null;
  net.mirror.puppets = []; net.mirror.props = []; net.mirror.effects = []; net.mirror.bubbles = [];
  net.targets.clear(); net.pendingNeed.clear();
  if (toTitle) enterTitle();
}

/* ---- host --------------------------------------------------------------- */
function startHosting() {
  net.screen = "hosting";
  net.status = "STARTING...";
  loadPeerJs().then(() => {
    const tryCode = () => {
      net.code = makeRoomCode();
      const peer = new Peer(NET_PREFIX + net.code);
      net.peer = peer;
      peer.on("open", () => { net.hosting = true; net.status = "WAITING FOR PLAYER 2..."; });
      peer.on("error", (err) => {
        if (err && err.type === "unavailable-id") tryCode();       // code collision
        else net.status = "CONNECTION ERROR - TRY AGAIN";
      });
      peer.on("connection", (conn) => {
        if (net.conn) { try { conn.close(); } catch (e) {} return; }   // room is full
        net.conn = conn;
        conn.on("data", (d) => hostOnData(d));
        conn.on("close", () => hostGuestLeft());
        conn.on("error", () => hostGuestLeft());
        net.status = "PLAYER 2 CONNECTED!";
        net.lastRecvAt = performance.now();
      });
    };
    tryCode();
  }).catch(() => { net.status = "COULD NOT LOAD PEERJS (OFFLINE?)"; });
}
function hostGuestLeft() {
  if (net.guestPuppetId) {
    const p = findEntity(live, net.guestPuppetId);
    if (p) p.scheme = null;
  }
  for (const c of ["G_LEFT", "G_RIGHT", "G_UP", "G_DOWN", "G_TALK"]) held.delete(c);
  talkStack = talkStack.filter(n => n !== "GUEST");
  net.conn = null;
  net.guestPuppetId = null;
  toast("PLAYER 2 LEFT THE ROOM");
}

function entDescriptor(e) {
  return e.isProp ? { a: "ent", k: "v", id: e.id, propId: e.propId, x: e.x, y: e.y }
                  : { a: "ent", k: "p", id: e.id, spec: e.spec, x: e.x, y: e.y };
}
function hostOnData(d) {
  if (!d || typeof d !== "object") return;
  net.lastRecvAt = performance.now();
  switch (d.a) {
    case "join": {
      const spec = makeSpec((d.spec && d.spec.name) || "GUEST", (d.spec && d.spec.slots) || {}, (d.spec && d.spec.colors) || {});
      const p = spawnPuppet(spec, 240, 150);
      p.scheme = "GUEST";
      p.guest = true;
      net.guestPuppetId = p.id;
      const ents = [...live.puppets, ...live.props].map(entDescriptor);
      netSend({ a: "init", ents, you: p.id });
      toast((spec.name || "PLAYER 2") + " JOINED THE SHOW");
      break;
    }
    case "k": {
      const m = d.m | 0;
      const set = (code, on) => { if (on) held.add(code); else held.delete(code); };
      set("G_LEFT", m & 1); set("G_RIGHT", m & 2); set("G_UP", m & 4); set("G_DOWN", m & 8);
      const talking = !!d.talk;
      const inStack = talkStack.includes("GUEST");
      if (talking && !inStack) talkStack.push("GUEST");
      if (!talking && inStack) talkStack = talkStack.filter(n => n !== "GUEST");
      break;
    }
    case "use": {
      const p = findEntity(live, net.guestPuppetId);
      if (p && mode === "stage") useAction(p);
      break;
    }
    case "expr": {
      const p = findEntity(live, net.guestPuppetId);
      if (p && EXPRESSIONS[d.kind]) exprAction(p, d.kind);
      break;
    }
    case "bub": {
      const p = findEntity(live, net.guestPuppetId);
      const text = String(d.text || "").slice(0, 60).trim();
      if (p && text) {
        const dur = Math.max(1800, Math.min(6000, 1200 + text.length * 55));
        liveBubble(p.id, text, dur);
        if (recording) recEvent({ type: "bubble", id: p.id, text, dur });
      }
      break;
    }
    case "need": {
      const e = findEntity(live, d.id);
      if (e) netSend(entDescriptor(e));
      break;
    }
    case "bye": hostGuestLeft(); break;
  }
}
/* One-shot visual triggers so the guest can re-spawn matching particles. */
function netFX(obj) {
  if (net.hosting && net.conn) netSend(Object.assign({ a: "fx" }, obj));
}

function hostTick(dt) {
  if (!net.hosting || !net.conn) return;
  net.sendAcc = (net.sendAcc || 0) + dt;
  const busy = mode !== "stage";
  if (net.sendAcc < (busy ? 500 : 50)) return;
  net.sendAcc = 0;
  if (busy) { netSend({ a: "s", busy: 1 }); return; }
  const snap = {
    a: "s",
    bd: live.backdrop,
    w: live.weather,
    wip: Math.round(performance.now() - live.wipeAt),
    r: recording ? 1 : 0,
    cue: music.playing ? music.playing.track.name : null,
    P: live.puppets.map(p => [p.id, p.x, p.y, p.facing, p.jaw,
      p.expression || "", Math.max(0, Math.round(p.exprT)), Math.max(0, Math.round(p.useT)),
      p.vehicle || 0, p.scheme ? SCHEMES[p.scheme].label : "",
      p.layerMode === "manual" ? 1 : 0, p.manualZ]),
    V: live.props.map(v => [v.id, v.x, v.y, v.facing, v.layerMode === "manual" ? 1 : 0, v.manualZ]),
    B: live.bubbles.map(b => [b.id, b.text, Math.max(0, Math.round(b.until - performance.now()))])
  };
  netSend(snap);
}

/* ---- guest -------------------------------------------------------------- */
function startJoin(code) {
  net.screen = "join";
  net.status = "CONNECTING...";
  loadPeerJs().then(() => {
    const peer = new Peer();
    net.peer = peer;
    peer.on("error", () => { net.status = "COULD NOT REACH ROOM " + code; });
    peer.on("open", () => {
      const conn = peer.connect(NET_PREFIX + code, { reliable: true });
      net.conn = conn;
      conn.on("open", () => {
        net.guesting = true;
        net.code = code;
        net.screen = "picker";
        net.status = "";
        net.lastRecvAt = performance.now();
      });
      conn.on("data", (d) => guestOnData(d));
      conn.on("close", () => { if (net.guesting) { toast("HOST CLOSED THE ROOM"); leaveNet(true); } });
      conn.on("error", () => { net.status = "CONNECTION FAILED"; });
    });
  }).catch(() => { net.status = "COULD NOT LOAD PEERJS (OFFLINE?)"; });
}
function guestPick(spec) {
  net.mySpec = JSON.parse(JSON.stringify(spec));
  netSend({ a: "join", spec: net.mySpec });
  mode = "net-guest";
  net.screen = null;
}
function guestAddEnt(d) {
  if (findEntity(net.mirror, d.id)) return;
  if (d.k === "p") net.mirror.puppets.push(new Puppet(d.spec, d.x, d.y, d.id));
  else net.mirror.props.push(new Prop(d.propId, d.x, d.y, d.id));
  net.pendingNeed.delete(d.id);
}
function guestOnData(d) {
  if (!d || typeof d !== "object") return;
  net.lastRecvAt = performance.now();
  switch (d.a) {
    case "init":
      net.myId = d.you;
      for (const e of d.ents) guestAddEnt(e);
      break;
    case "ent": guestAddEnt(d); break;
    case "s": {
      if (d.busy) { net.hostBusy = true; return; }
      net.hostBusy = false;
      net.mirror.backdrop = d.bd;
      net.mirror.weather = d.w;
      net.mirror.wipeAt = performance.now() - d.wip;
      net.hostRec = !!d.r;
      net.cueName = d.cue;
      const seen = new Set();
      for (const row of d.P) { seen.add(row[0]); net.targets.set(row[0], { k: "p", row }); }
      for (const row of d.V) { seen.add(row[0]); net.targets.set(row[0], { k: "v", row }); }
      // reconcile: drop mirrored entities the host no longer has
      net.mirror.puppets = net.mirror.puppets.filter(p => seen.has(p.id));
      net.mirror.props = net.mirror.props.filter(p => seen.has(p.id));
      for (const id of [...net.targets.keys()]) if (!seen.has(id)) net.targets.delete(id);
      // ask (once) about ids we can't draw yet
      for (const id of seen) {
        if (!findEntity(net.mirror, id) && !net.pendingNeed.has(id)) {
          net.pendingNeed.add(id);
          netSend({ a: "need", id });
        }
      }
      // my puppet vanished (host deleted it): pick a new character
      if (net.myId && !seen.has(net.myId)) { net.myId = null; mode = "net"; net.screen = "picker"; }
      net.mirror.bubbles = d.B.map(([id, text, left]) => ({ id, text, until: performance.now() + left }));
      break;
    }
    case "fx": {
      if (d.kind === "ability") {
        const p = findEntity(net.mirror, d.id);
        if (p && !p.isProp) spawnAbility(net.mirror, p);
      } else if (d.kind === "prop") {
        const v = findEntity(net.mirror, d.pid);
        if (v) propFX(net.mirror, v, d.result);
      }
      break;
    }
    case "bye": toast("HOST LEFT"); leaveNet(true); break;
  }
}

/* Guest fixed-step: ease mirrored entities toward their snapshot targets and
   reuse the ordinary animation machinery on the interpolated motion. */
function guestTick(dt) {
  if (!net.guesting) return;
  // input: both key sets fold into one logical mask
  if (mode === "net-guest" && !textInput) {
    const m = (held.has("KeyA") || held.has("ArrowLeft") ? 1 : 0)
            | (held.has("KeyD") || held.has("ArrowRight") ? 2 : 0)
            | (held.has("KeyW") || held.has("ArrowUp") ? 4 : 0)
            | (held.has("KeyS") || held.has("ArrowDown") ? 8 : 0);
    const talk = held.has("ShiftLeft") || held.has("ShiftRight");
    net.keepAcc += dt;
    if (m !== net.lastMask || talk !== net.lastTalk || net.keepAcc > 400) {
      net.lastMask = m; net.lastTalk = talk; net.keepAcc = 0;
      netSend({ a: "k", m, talk });
    }
  }
  if (net.hostBusy || mode !== "net-guest") return;
  for (const e of [...net.mirror.puppets, ...net.mirror.props]) {
    const tgt = net.targets.get(e.id);
    if (!tgt) continue;
    const r = tgt.row;
    const px0 = e.fx;
    e.fx += (r[1] - e.fx) * 0.4;
    e.fy += (r[2] - e.fy) * 0.4;
    const dx = e.fx - px0;
    e.facing = r[3];
    if (e.isProp) {
      e.animT += dt;
      e.wheelPhase += Math.abs(dx) * 0.25;
      e.layerMode = r[4] ? "manual" : "auto"; e.manualZ = r[5];
    } else {
      e.animate(dt, e.vehicle ? 0 : dx);
      e.jaw = r[4];
      e.expression = r[5] || null;
      e.exprT = r[6];
      e.useT = r[7];
      e.vehicle = r[8] || null;
      e.netBadge = r[9] || "";
      e.layerMode = r[10] ? "manual" : "auto"; e.manualZ = r[11];
    }
  }
  updateEffects(net.mirror, dt);
}

function netTick(dt) {
  hostTick(dt);
  guestTick(dt);
  // connection watchdog
  if ((net.guesting || (net.hosting && net.conn)) && performance.now() - net.lastRecvAt > 8000) {
    if (net.guesting) { toast("LOST THE HOST - LEAVING ROOM"); leaveNet(true); }
    else hostGuestLeft();
  }
}

/* ---- screens ------------------------------------------------------------ */
const joinInput = { text: "" };
function renderNet(ctx) {
  ctx.drawImage(BACKDROPS[THEATER_BD].canvas, 0, 0);
  rect(ctx, 40, 20, 240, 140, NIGHT);
  frameRect(ctx, 40, 20, 240, 140, SAND);
  drawTextC(ctx, "PLAY TOGETHER", IW / 2, 26, SAND, 2);
  if (net.screen === "menu") {
    drawTextC(ctx, "TWO PLAYERS, TWO COMPUTERS, ONE ROOM", IW / 2, 46, SILVER);
    drawTextC(ctx, "(SIT TOGETHER - ONE MIC RECORDS EVERYONE)", IW / 2, 55, SILVER);
    const items = [
      ["HOST A ROOM", () => startHosting()],
      ["JOIN A ROOM", () => {
        net.screen = "joincode"; joinInput.text = "";
        textInput = { tag: "roomcode", max: 4,
          get: () => joinInput.text,
          set: (v) => { joinInput.text = v.toUpperCase().replace(/[^A-Z0-9]/g, ""); },
          onEnter: () => { if (joinInput.text.length === 4) startJoin(joinInput.text); else net.screen = "menu"; } };
      }],
      ["BACK", () => leaveNet(true)]
    ];
    let y = 70;
    for (const [label, cb] of items) {
      panel(ctx, 100, y, 120, 15, DUSK, SILVER);
      drawTextC(ctx, label, IW / 2, y + 4, WHITE);
      uiBtn(100, y, 120, 15, cb);
      y += 19;
    }
  } else if (net.screen === "hosting") {
    drawTextC(ctx, "ROOM CODE", IW / 2, 52, SILVER);
    drawTextC(ctx, net.code || "....", IW / 2, 64, WHITE, 2);
    drawTextC(ctx, net.status, IW / 2, 90, net.conn ? LIME : ICE);
    drawTextC(ctx, "PLAYER 2: OPEN THE GAME, PLAY TOGETHER,", IW / 2, 104, SILVER);
    drawTextC(ctx, "JOIN A ROOM, AND TYPE THIS CODE", IW / 2, 113, SILVER);
    panel(ctx, 100, 130, 120, 15, DUSK, SILVER);
    drawTextC(ctx, net.conn ? "TO THE STAGE" : "BACK", IW / 2, 134, WHITE);
    uiBtn(100, 130, 120, 15, () => { if (net.conn) mode = "stage"; else leaveNet(true); });
    if (net.conn && mode === "net") { /* host may stay here or go perform */ }
  } else if (net.screen === "joincode" || net.screen === "join") {
    drawTextC(ctx, "TYPE THE HOST'S 4-CHARACTER CODE", IW / 2, 52, SILVER);
    panel(ctx, 130, 64, 60, 18, DUSK, textInput ? ICE : SILVER);
    drawTextC(ctx, joinInput.text + (textInput && (Math.floor(performance.now() / 400) % 2) ? "_" : ""), IW / 2, 69, WHITE, 1);
    drawTextC(ctx, net.status, IW / 2, 92, ICE);
    panel(ctx, 100, 130, 120, 15, DUSK, SILVER);
    drawTextC(ctx, "BACK", IW / 2, 134, WHITE);
    uiBtn(100, 130, 120, 15, () => leaveNet(true));
    if (net.screen === "joincode" && joinInput.text.length === 4 && !textInput) startJoin(joinInput.text);
  } else if (net.screen === "picker") {
    drawTextC(ctx, "CONNECTED TO ROOM " + net.code, IW / 2, 46, LIME);
    drawTextC(ctx, "PICK YOUR PUPPET", IW / 2, 58, WHITE);
    let x = 64, y = 72;
    for (let i = 0; i < Math.min(roster.length, 14); i++) {
      panel(ctx, x, y, 26, 26, DUSK, SLATE);
      ctx.drawImage(miniPortrait(roster[i]), x + 1, y + 2);
      uiBtn(x, y, 26, 26, ((idx) => () => guestPick(roster[idx]))(i));
      x += 28;
      if (x > 228) { x = 64; y += 28; }
    }
    panel(ctx, 100, 136, 120, 14, DUSK, SILVER);
    drawTextC(ctx, "LEAVE ROOM", IW / 2, 139, WHITE);
    uiBtn(100, 136, 120, 14, () => leaveNet(true));
  }
}

/* Guest's live view: the mirrored stage, or the backstage curtain. */
function renderNetGuest(ctx) {
  if (net.hostBusy) {
    ctx.drawImage(BACKDROPS[THEATER_BD].canvas, 0, 0);
    rect(ctx, 60, 60, 200, 44, NIGHT);
    frameRect(ctx, 60, 60, 200, 44, SAND);
    drawTextC(ctx, "HOST IS BACKSTAGE", IW / 2, 68, SAND, 2);
    drawTextC(ctx, "THE STAGE WILL RETURN IN A MOMENT", IW / 2, 88, SILVER);
  } else {
    renderScene(ctx, net.mirror, { clean: false, time: performance.now() });
  }
  // slim status strip
  rect(ctx, 0, 0, IW, 11, NIGHT);
  drawText(ctx, "ROOM " + net.code, 3, 2, ICE);
  if (net.mySpec) drawText(ctx, "YOU: " + net.mySpec.name, 60, 2, SAND);
  if (net.hostRec) {
    if (Math.floor(performance.now() / 400) % 2) rect(ctx, IW - 78, 3, 5, 5, RED);
    drawTextR(ctx, "REC", IW - 62, 2, RED);
  }
  if (net.cueName) drawTextR(ctx, net.cueName, IW - 88, 2, LIME);
  panel(ctx, IW - 56, 0, 56, 11, DUSK, SLATE);
  drawTextC(ctx, "LEAVE", IW - 28, 2, WHITE);
  uiBtn(IW - 56, 0, 56, 11, () => leaveNet(true));
  drawTextC(ctx, "WASD/ARROWS MOVE - SHIFT TALK - E/ENTER USE - Z X C V B FACES - T SPEAK", IW / 2, IH - 8, SILVER);
  renderTypedBubble(ctx);
}

/* Guest one-shot keys (movement/talk go through the mask in guestTick). */
function netGuestKey(code) {
  if (code === "KeyE" || code === "Enter") { netSend({ a: "use" }); return true; }
  for (const name of ["WASD", "ARROWS"]) {
    const kind = EXPR_KEYS[name] && EXPR_KEYS[name][code];
    if (kind) { netSend({ a: "expr", kind }); return true; }
  }
  if (code === "KeyT") {
    typedBubble.active = true;
    typedBubble.text = "";
    typedBubble.target = null;
    textInput = { tag: "bubble", max: 60,
      get: () => typedBubble.text, set: (v) => { typedBubble.text = v; },
      onEnter: () => { typedBubble.active = false; const t = typedBubble.text.trim(); if (t) netSend({ a: "bub", text: t }); },
      onCancel: () => { typedBubble.active = false; } };
    return true;
  }
  if (code === "Escape") { leaveNet(true); return true; }
  return false;
}

/* Badge override for mirrored puppets (they have no local scheme). */
function netBadgeLabel(p) { return p.netBadge || ""; }
/* ============================================================================
   MAIN — fixed-timestep update loop, mouse/key routing, boot.
   The same STEP drives live performance, playback and export, so all three
   run at identical speed.
   ==========================================================================*/

let mode = "stage";   // "stage" | "builder" | "playback" | "export"

/* ---- one fixed step ----------------------------------------------------- */
function update(dt) {
  updateMicAmp();
  netTick(dt);

  if (mode === "stage") {
    // keyboard-driven puppets (all schemes work simultaneously); a boarded
    // puppet's controls drive its vehicle instead
    for (const p of live.puppets) {
      if (!p.scheme) continue;
      if (p.vehicle) {
        const v = findEntity(live, p.vehicle);
        if (v) driveVehicle(v, SCHEMES[p.scheme]);
      } else driveScheme(p, SCHEMES[p.scheme]);
    }
    // dragging (converts cursor to internal pixels; positions stay integers)
    if (dragging) {
      dragging.p.vx = 0; dragging.p.vy = 0;
      dragging.p.fx = clamp(mouse.x - dragging.dx, STAGE_MINX, STAGE_MAXX);
      dragging.p.fy = clamp(mouse.y - dragging.dy, entityMinY(dragging.p), STAGE_MAXY);
    }
    // riders follow their vehicles
    for (const p of live.puppets) {
      if (!p.vehicle) continue;
      const v = findEntity(live, p.vehicle);
      if (v) { p.fx = v.fx; p.fy = v.fy; p.facing = v.facing; }
    }
    // props: animation timers, wheel roll when dragged, kicked-ball physics
    updateKineticProps(dt);
    for (const v of live.props) {
      v.animT += dt;
      if (v.wobbleT > 0) v.wobbleT -= dt;
      const dvx = v.fx - (v._pfx !== undefined ? v._pfx : v.fx);
      if (dragging && dragging.p === v) v.wheelPhase += Math.abs(dvx) * 0.25;
      if (dragging && dragging.p === v) v.kinetic = false;   // grabbing stops a ball
      v._pfx = v.fx;
    }
    // walk cycles from actual movement (drag or keys — same path)
    for (const p of live.puppets) {
      const dx = p.fx - (p._pfx !== undefined ? p._pfx : p.fx);
      if (dragging && dragging.p === p) {
        if (dx > 0.3) p.facing = 1; else if (dx < -0.3) p.facing = -1;
      }
      p.animate(dt, p.vehicle ? 0 : dx);
      p._pfx = p.fx;
    }
    updateEffects(live, dt);
    // mouth: one speaker at a time
    const speaker = currentSpeaker();
    let amp = 0;
    if (speaker) amp = mic.ok ? mic.amp : flapAmp(performance.now());
    const jaw = liveMouth.update(amp, dt);
    for (const p of live.puppets) p.jaw = (p === speaker) ? jaw : 0;
    if (recording) recordSample(speaker ? speaker.id : -1, amp);
    speechStep(speaker);                       // auto-caption utterances
    duckMusic(jaw > 0);                        // narration over the theme song
    if (live.pendingBackdrop && performance.now() >= live.pendingBackdrop.at) {
      setBackdrop(live.pendingBackdrop.idx);   // lands mid-wipe
      live.pendingBackdrop = null;
    }
  } else if (mode === "playback" || mode === "export") {
    stepPlayback(dt);
  } else if (mode === "title") {
    updateTitle(dt);
  }
  if (toastT > 0) toastT -= dt;
}

/* ---- render ------------------------------------------------------------- */
function render(frameDt) {
  uiButtons = [];
  if (mode === "title") {
    renderTitle(sctx);
    renderToast(sctx);
  } else if (mode === "library") {
    renderLibrary(sctx);
    renderToast(sctx);
  } else if (mode === "builder") {
    renderBuilder(sctx, frameDt);
    renderToast(sctx);
  } else if (mode === "music") {
    renderMusicEd(sctx);
    renderToast(sctx);
  } else if (mode === "net") {
    renderNet(sctx);
    renderToast(sctx);
  } else if (mode === "net-guest") {
    renderNetGuest(sctx);
    renderToast(sctx);
  } else if (mode === "stage") {
    renderScene(sctx, live, { clean: false });
    if (live.puppets.length === 0 && !recording) {
      drawTextC(sctx, "CLICK A PUPPET IN THE ROSTER TO ADD IT TO THE STAGE", IW / 2, 70, WHITE);
    }
    renderTopBar(sctx, currentSpeaker());
    renderSelectionPanel(sctx);
    renderCueBar(sctx);
    renderDrawer(sctx);
    renderTypedBubble(sctx);
    renderShowTitleInput(sctx);
    renderToast(sctx);
    if (helpOpen) renderHelp(sctx);
  } else if (mode === "playback") {
    renderScene(sctx, play, { clean: true, time: playbackClock() });
    drawShowIntro(sctx, playbackClock(), play.take);
    renderTransport(sctx);
  } else if (mode === "export") {
    renderScene(sctx, play, { clean: true, time: playbackClock() });
    drawShowIntro(sctx, playbackClock(), play.take);   // curtain IS in the video
    captureExportFrame();                       // export gets the clean frame
    // progress overlay only on the visible screen, never in the file
    const t = clamp(playbackClock(), 0, play.take.duration);
    const pct = Math.floor(100 * t / play.take.duration);
    panel(sctx, 80, 80, 160, 30, NIGHT, ICE);
    drawTextC(sctx, "EXPORTING " + pct + "%", IW / 2, 84, WHITE);
    rect(sctx, 90, 96, 140, 8, DUSK);
    rect(sctx, 90, 96, Math.floor(140 * t / play.take.duration), 8, SKY);
    panel(sctx, 136, 114, 48, 12, DUSK, SLATE);
    drawTextC(sctx, "CANCEL", IW / 2, 117, WHITE);
    uiBtn(136, 114, 48, 12, () => cancelExport());
  }
  dctx.drawImage(screen, 0, 0, IW * SCALE, IH * SCALE);
}

/* ---- mouse routing ------------------------------------------------------ */
function onMouseDown(x, y) {
  if (mode === "builder") {
    textInput = null;             // clicking anywhere blurs the name field...
    hitUI(x, y);                  // ...unless the click re-focuses it
    return;
  }
  if (mode === "title" || mode === "library" || mode === "playback" || mode === "export"
      || mode === "music" || mode === "net" || mode === "net-guest") {
    if (mode === "music") textInput = null;   // clicking blurs the name field
    hitUI(x, y);
    return;
  }
  // stage
  if (helpOpen) { hitUI(x, y); return; }
  if (hitUI(x, y)) return;
  // pick the topmost puppet or prop under the cursor (composed part bbox);
  // a boarded puppet is reached through its vehicle
  const sorted = sortStage([...live.puppets, ...live.props]);
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i], b = p.bbox;
    if (!p.isProp && p.vehicle) continue;
    if (b && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) {
      selected = p;
      dragging = { p, dx: x - p.x, dy: y - p.y };
      return;
    }
  }
  selected = null;
}

/* Trigger a facial expression (recorded to the timeline like everything). */
function exprAction(p, kind) {
  p.expression = kind;
  p.exprT = EXPR_MS;
  if (recording) recEvent({ type: "expr", id: p.id, kind });
}

/* USE for one puppet: exit/enter a nearby vehicle, else fire the held item.
   Live-only; playback regenerates the same things from recorded events. */
function useAction(p) {
  if (mode !== "stage" || !p || p.isProp) return;
  const now = performance.now();
  if (now - p.abilityAt < 350) return;      // cooldown
  p.abilityAt = now;
  if (p.vehicle) { unboardVehicle(live, p); return; }
  const v = vehicleNear(live, p);
  if (v) { boardVehicle(p, v); return; }
  const w = propNear(live, p);                 // kick / break / open / rustle...
  if (w && interactProp(p, w)) return;
  if (spawnAbility(live, p)) {
    if (recording) recEvent({ type: "ability", id: p.id });
    netFX({ kind: "ability", id: p.id });
  }
}
function onMouseMove(x, y) {
  if (scrubbing && mode === "playback") scrubTo(x);
}
function onMouseUp() {
  dragging = null;
  scrubbing = false;
}

/* ---- one-shot keys ------------------------------------------------------ */
function onKeyPressed(code) {
  if (mode === "net-guest") { netGuestKey(code); return; }
  if (mode === "net" && code === "Escape") { leaveNet(true); return; }
  if (code === "KeyH" && (mode === "stage")) helpOpen = !helpOpen;
  // item ability / vehicle boarding, per control scheme
  if (mode === "stage" && !textInput) {
    for (const name of SCHEME_NAMES) {
      if (SCHEMES[name].use !== code) continue;
      for (const p of live.puppets) if (p.scheme === name) useAction(p);
    }
    if (code === "Space") {
      const target = (dragging && !dragging.p.isProp) ? dragging.p
                   : (selected && !selected.isProp && live.puppets.includes(selected)) ? selected : null;
      if (target) useAction(target);
    }
    if (code === "KeyT") {
      const target = (selected && !selected.isProp && live.puppets.includes(selected)) ? selected
                   : live.puppets[0];
      if (target) openTypedBubble(target);
    }
    // facial expression hotkeys, per player (fallback: P1 keys drive the
    // selected puppet when nobody has the WASD controller)
    for (const name of SCHEME_NAMES) {
      const kind = EXPR_KEYS[name] && EXPR_KEYS[name][code];
      if (!kind) continue;
      let target = null;
      for (const p of live.puppets) if (p.scheme === name) target = p;
      if (!target && name === "WASD" && selected && !selected.isProp && live.puppets.includes(selected))
        target = selected;
      if (target) exprAction(target, kind);
    }
    // music cue hotkeys: 1-8 start a track (same again stops), 0 stops
    if (code === "Digit0") cueMusic(null);
    const dm = /^Digit([1-8])$/.exec(code);
    if (dm) {
      const tr = allTracks()[Number(dm[1]) - 1];
      if (tr) cueMusic(music.playing && music.playing.track.id === tr.id ? null : tr);
    }
  }
  if (code === "Escape") {
    if (helpOpen) helpOpen = false;
    else if (mode === "builder") exitBuilder();
    else if (mode === "playback") exitPlayback();
    else if (mode === "music") exitMusicEd();
    else if (mode === "library") mode = "title";
    else selected = null;
  }
  // Delete removes the selected puppet — never while typing in a text field,
  // and Backspace/Delete don't collide with any movement scheme.
  if ((code === "Delete" || code === "Backspace") && mode === "stage" && selected && !textInput) {
    removePuppet(selected);
  }
}

/* ---- boot + loop -------------------------------------------------------- */
loadRoster();
loadTracks();
initShowStore();
enterTitle();

let lastT = performance.now(), acc = 0, lastTickAt = 0;
function runFrame(now) {
  lastTickAt = now;
  let frameDt = now - lastT;
  lastT = now;
  if (frameDt > 250) frameDt = 250;   // tab was hidden: don't spiral
  acc += frameDt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render(frameDt);
}
function tick(now) {
  requestAnimationFrame(tick);
  runFrame(now);
}
requestAnimationFrame(tick);
</script>
</body>
