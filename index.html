function duckMusic(ducked) {
  if (!music.playing) return;
  const ctx = audioCtx();
  music.playing.bus.gain.setTargetAtTime(ducked ? 0.22 : 0.6, ctx.currentTime, 0.08);
}

/* Live music cue from the stage (number keys / cue bar). While recording it
   lands in the timeline as a {type:"music", trackData} event — trackData is
   a full embedded copy (null = stop) — so mid-take switches replay exactly. */
function cueMusic(track) {
  audioCtx();
  if (!track) {
    stopMusic();
    if (recording) recEvent({ type: "music", trackData: null });
    toast("MUSIC OFF");
    return;
  }
  playTrack(track, {});
  if (recording) recEvent({ type: "music", trackData: JSON.parse(JSON.stringify(track)) });
  toast("NOW PLAYING: " + track.name);
}
/* ============================================================================
   INPUT — three keyboard control schemes usable simultaneously on one
   keyboard, plus mouse handling. Key state lives in a held-keys set updated
   on keydown/keyup and is read once per fixed timestep; puppets are never
   moved inside event handlers (key repeat would stutter the motion).
   ==========================================================================*/

const SCHEMES = {
  WASD:   { left: "KeyA", right: "KeyD", up: "KeyW", down: "KeyS", talk: "ShiftLeft",  use: "KeyE",  label: "WASD" },
  ARROWS: { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp", down: "ArrowDown", talk: "ShiftRight", use: "Enter", label: "ARWS" }
};
const SCHEME_NAMES = ["WASD", "ARROWS"];

/* Facial expression hotkeys, one row per player (the old third controller's
   IJKL cluster now belongs to player 2's expressions). */
const EXPR_KEYS = {
  WASD:   { KeyZ: "cry", KeyX: "angry", KeyC: "happy", KeyV: "laugh", KeyB: "disgust" },
  ARROWS: { KeyI: "cry", KeyJ: "angry", KeyK: "happy", KeyL: "laugh", KeyU: "disgust" }
};

const held = new Set();          // e.code of every currently-held key
let talkStack = [];              // scheme names, in press order (last = active)
let textInput = null;            // {get,set,max} — routes typing when focused

const PREVENT = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "Enter"]);

window.addEventListener("keydown", (e) => {
  if (textInput) {                       // a canvas text field has focus
    if (e.key === "Enter" || e.key === "Escape") {
      const ti = textInput;
      textInput = null;
      if (e.key === "Enter" && ti.onEnter) ti.onEnter();
      if (e.key === "Escape" && ti.onCancel) ti.onCancel();
    }
    else if (e.key === "Backspace") textInput.set(textInput.get().slice(0, -1));
    else if (e.key.length === 1 && (e.key in FONT) && textInput.get().length < textInput.max)
      textInput.set(textInput.get() + e.key);
    e.preventDefault();
    return;
  }
  if (PREVENT.has(e.code)) e.preventDefault();
  if (!e.repeat) {
    held.add(e.code);
    for (const name of SCHEME_NAMES)
      if (SCHEMES[name].talk === e.code) {
        talkStack = talkStack.filter(n => n !== name);
        talkStack.push(name);            // most recently pressed wins
      }
    onKeyPressed(e.code);                // one-shot actions (help, delete...)
  }
});
window.addEventListener("keyup", (e) => {
  held.delete(e.code);
  for (const name of SCHEME_NAMES)
    if (SCHEMES[name].talk === e.code) talkStack = talkStack.filter(n => n !== name);
});
window.addEventListener("blur", () => { held.clear(); talkStack = []; });

/* Velocity-based movement, run once per fixed timestep from update().
   Horizontal keys accelerate toward a modest top speed; releasing
   decelerates to a stop so the walk cycle reads naturally. Vertical keys
   walk the puppet toward/away from the viewer (no scaling with depth). */
function driveScheme(p, sc) {
  const ACCX = 0.14, TOPX = 1.3, ACCY = 0.10, TOPY = 0.8, FRICTION = 0.82;
  let ix = 0, iy = 0;
  if (held.has(sc.left)) ix -= 1;
  if (held.has(sc.right)) ix += 1;
  if (held.has(sc.up)) iy -= 1;
  if (held.has(sc.down)) iy += 1;
  p.vx = ix ? clamp(p.vx + ix * ACCX, -TOPX, TOPX) : p.vx * FRICTION;
  p.vy = iy ? clamp(p.vy + iy * ACCY, -TOPY, TOPY) : p.vy * FRICTION;
  if (Math.abs(p.vx) < 0.02) p.vx = 0;
  if (Math.abs(p.vy) < 0.02) p.vy = 0;
  if (ix > 0) p.facing = 1; else if (ix < 0) p.facing = -1;
  p.fx = clamp(p.fx + p.vx, STAGE_MINX, STAGE_MAXX);
  p.fy = clamp(p.fy + p.vy, STAGE_MINY, STAGE_MAXY);
}

/* Assigning a scheme releases it from whoever had it. */
function assignScheme(puppets, p, name) {
  for (const q of puppets) if (q.scheme === name) q.scheme = null;
  p.scheme = name;
}

/* ---- Mouse --------------------------------------------------------------
   Screen position -> internal pixels: divide by the integer scale, floor. */
function toInternal(e) {
  const r = display.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) / SCALE), y: Math.floor((e.clientY - r.top) / SCALE) };
}

const mouse = { x: 0, y: 0, down: false };
let uiButtons = [];      // rebuilt every rendered frame by the UI pass
let dragging = null;     // {p, dx, dy} while a puppet is dragged
let scrubbing = false;   // dragging the transport scrub bar

function uiBtn(x, y, w, h, cb) { uiButtons.push({ x, y, w, h, cb }); }
function hitUI(x, y) {
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) { b.cb(x, y); return true; }
  }
  return false;
}

display.addEventListener("mousedown", (e) => {
  e.preventDefault();
  const m = toInternal(e);
  mouse.x = m.x; mouse.y = m.y; mouse.down = true;
  requestMic();          // first user gesture: try to get the mic ready
  audioCtx();
  onMouseDown(m.x, m.y);
});
window.addEventListener("mousemove", (e) => {
  const m = toInternal(e);
  mouse.x = m.x; mouse.y = m.y;
  onMouseMove(m.x, m.y);
});
window.addEventListener("mouseup", () => { mouse.down = false; onMouseUp(); });
display.addEventListener("contextmenu", (e) => e.preventDefault());
/* ============================================================================
   PERFORMANCE CAPTURE — recording a show captures DATA, not pixels.

   TIMELINE EVENT SCHEMA — each event: {t, type, ...} with t in ms relative
   to the start of the take. Types:
     spawn    {id, spec, x, y, facing}   puppet added (full character spec is
                                         embedded so takes survive roster edits)
     remove   {id}                       puppet removed
     pos      {id, x, y}                 integer position keyframe (sampled on
                                         change, not every frame — sparse)
     layer    {id, mode, z}              layer-order change ("auto"/"manual")
     backdrop {index}                    scene swap
     speaker  {id}                       active-speaker change (-1 = nobody)
     spawnProp{id, propId, x, y}         prop/vehicle added to the stage
     ability  {id}                       puppet fired its held item's ability
     board    {id, vid}                  puppet climbed into vehicle `vid`
     unboard  {id}                       puppet climbed out again
     interact {id, pid, result}          puppet used prop `pid` (kick/break/
                                         open/rustle/nudge/flare) - replays
                                         the cosmetic burst only; the state
                                         change arrives via pos/remove events
     bubble   {id, text, dur}            speech bubble (typed, or Whisper
                                         auto-caption back-dated to when the
                                         utterance started)
     weather  {kind}                     weather overlay change
     wipe     {}                         scene-wipe transition (the backdrop
                                         event lands mid-wipe, ~350ms later)
     music    {trackData}                music cue: start this embedded track
                                         here (null = stop the music)
     expr     {id, kind}                 facial expression (cry/angry/happy/
                                         laugh/disgust), shown for EXPR_MS
   Props share the id space and the pos/layer/remove event types with
   puppets. Ability effects are transient eye-candy: they are re-spawned
   from ability events during playback, never stored as pixels.
   Keyboard motion is recorded exactly like dragging — as resulting position
   keyframes — so playback never replays input.

   AMPLITUDE TRACK — take.amps is [[t, amp], ...] sampled ~30Hz while
   recording; playback/export feed it through the same MouthQuantizer.

   NARRATOR AUDIO — captured separately by a MediaRecorder on the raw mic
   stream, kept in memory as a Blob. A take with no mic is simply silent.

   To add a new event type: emit it in recEvent(), apply it in applyEvent().
   ==========================================================================*/

let recording = null;   // {t0, events, amps, lastPos:Map, mediaRec, chunks}
let take = null;        // {duration, events, amps, audioBlob, audioURL, keyframes:Map}

function recNow() { return Math.round(performance.now() - recording.t0); }
function recEvent(ev) { ev.t = recNow(); recording.events.push(ev); }

function startRecording() {
  recSession++;
  recording = { t0: performance.now(), events: [], amps: [], lastPos: new Map(), mediaRec: null, chunks: [] };
  // Snapshot initial state at t=0 so playback can reconstruct the stage.
  recording.events.push({ t: 0, type: "backdrop", index: live.backdrop });
  recording.events.push({ t: 0, type: "weather", kind: live.weather });
  // theme song: whatever is cued live wins, else the studio's "next show"
  // pick. Restarted at t=0 and recorded as the take's first music event.
  const tr = music.playing ? music.playing.track : currentTrack();
  recording.trackData = tr ? JSON.parse(JSON.stringify(tr)) : null;
  if (tr) {
    recording.events.push({ t: 0, type: "music", trackData: recording.trackData });
    playTrack(tr, {});
  }
  for (const p of live.puppets) {
    recording.events.push({ t: 0, type: "spawn", id: p.id, spec: p.spec, x: p.x, y: p.y, facing: p.facing });
    if (p.layerMode === "manual")
      recording.events.push({ t: 0, type: "layer", id: p.id, mode: "manual", z: p.manualZ });
    recording.lastPos.set(p.id, { x: p.x, y: p.y, t: 0 });
  }
  for (const v of live.props) {
    recording.events.push({ t: 0, type: "spawnProp", id: v.id, propId: v.propId, x: v.x, y: v.y });
    if (v.layerMode === "manual")
      recording.events.push({ t: 0, type: "layer", id: v.id, mode: "manual", z: v.manualZ });
    recording.lastPos.set(v.id, { x: v.x, y: v.y, t: 0 });
  }
  for (const p of live.puppets)
    if (p.vehicle) recording.events.push({ t: 0, type: "board", id: p.id, vid: p.vehicle });
  recording.events.push({ t: 0, type: "speaker", id: -1 });
  recording.lastSpeaker = -1;
  recording.lastAmp = -1;
  if (mic.ok && mic.stream && window.MediaRecorder) {
    try {
      const rec = recording;   // handler closes over the take, not the global
      rec.mediaRec = new MediaRecorder(mic.stream);
      rec.mediaRec.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
      rec.mediaRec.start();
    } catch (err) { recording.mediaRec = null; }
  }
}

/* Called every fixed step while recording. */
function recordSample(speakerId, amp) {
  const t = recNow();
  for (const p of [...live.puppets, ...live.props]) {
    const last = recording.lastPos.get(p.id);
    if (!last || ((last.x !== p.x || last.y !== p.y) && t - last.t >= 33)) {
      recEvent({ type: "pos", id: p.id, x: p.x, y: p.y });
      recording.lastPos.set(p.id, { x: p.x, y: p.y, t });
    }
  }
  if (speakerId !== recording.lastSpeaker) {
    recEvent({ type: "speaker", id: speakerId });
    recording.lastSpeaker = speakerId;
  }
  const q = Math.round(amp * 1000) / 1000;
  if (recording.amps.length === 0 || t - recording.amps[recording.amps.length - 1][0] >= 33) {
    recording.amps.push([t, q]);
  }
}

function stopRecording() {
  const rec = recording;
  const duration = recNow();
  stopMusic();
  // final position keyframe for everything so playback ends in place
  for (const p of [...live.puppets, ...live.props]) recEvent({ type: "pos", id: p.id, x: p.x, y: p.y });
  const finalize = (audioBlob) => {
    if (take && take.audioURL) URL.revokeObjectURL(take.audioURL);
    // async captions may have landed out of order — keep the timeline sorted
    rec.events.sort((a, b) => a.t - b.t);
    take = {
      duration: Math.max(duration, 100),
      title: "",
      trackData: rec.trackData || null,
      events: rec.events,
      amps: rec.amps,
      audioBlob,
      audioURL: audioBlob ? URL.createObjectURL(audioBlob) : null,
      keyframes: buildKeyframes(rec.events)
    };
  };
  if (rec.mediaRec && rec.mediaRec.state !== "inactive") {
    rec.mediaRec.onstop = () => finalize(new Blob(rec.chunks, { type: rec.mediaRec.mimeType || "audio/webm" }));
    rec.mediaRec.stop();
  } else {
    finalize(null);
  }
  recording = null;
}

/* Index pos events per puppet id for fast interpolation during playback. */
function buildKeyframes(events) {
  const map = new Map();
  for (const ev of events) {
    if (ev.type === "spawn" || ev.type === "spawnProp") {
      if (!map.has(ev.id)) map.set(ev.id, []);
      map.get(ev.id).push({ t: ev.t, x: ev.x, y: ev.y });
    } else if (ev.type === "pos") {
      if (!map.has(ev.id)) map.set(ev.id, []);
      map.get(ev.id).push({ t: ev.t, x: ev.x, y: ev.y });
    }
  }
  return map;
}

function discardTake() {
  if (take && take.audioURL) URL.revokeObjectURL(take.audioURL);
  take = null;
}
/* ============================================================================
   PLAYBACK — replays a take by driving the same renderer from the timeline
   instead of live input. If the take has narrator audio, the <audio> element
   is the clock source so picture and sound stay locked; otherwise a simple
   accumulator clock is used. Walk cycles are regenerated from interpolated
   position deltas exactly as they are live — animation is never stored.
   ==========================================================================*/

const play = {
  active: false,
  exporting: false,
  take: null,           // the take being replayed (current or from the library)
  returnTo: "stage",    // where STOP goes back to: "stage" | "library"
  t: 0,
  playing: false,
  puppets: [],          // separate instances; the live stage is untouched
  props: [],
  effects: [],
  bubbles: [],
  weather: "none",
  wipeAt: -1e9,
  musicEv: null,        // active {t, trackData} music event (null = silence)
  musicApplied: null,   // last event actually started, to detect changes
  musicOuts: null,      // where the synth routes (export sets the mix node)
  backdrop: 0,
  speakerId: -1,
  eventIdx: 0,
  ampIdx: 0,
  audio: null,          // <audio> clock when the take has narration
  mouth: new MouthQuantizer(),
  ended: false
};

/* The narration <audio> is the clock while it has data; if the audio track is
   shorter than the timeline (or absent) the accumulator clock takes over so
   playback always reaches the end of the take. */
function playbackClock() {
  if (play.audio && !play.audio.ended && !isNaN(play.audio.currentTime)) return play.audio.currentTime * 1000;
  return play.t;
}

function enterPlayback(t, returnTo) {
  if (!t) return;
  stopMusic();               // a live cue doesn't bleed into playback
  mode = "playback";
  play.take = t;
  play.returnTo = returnTo || "stage";
  play.active = true;
  play.exporting = false;
  play.musicOuts = null;     // playback music goes to the speakers
  if (t.audioURL) {
    play.audio = new Audio(t.audioURL);
  } else play.audio = null;
  seekPlayback(0);
  resumePlayback();
}

function resumePlayback() {
  if (play.ended || playbackClock() >= play.take.duration - 1) seekPlayback(0);
  play.playing = true;
  play.ended = false;
  if (play.audio) play.audio.play().catch(() => { play.audio = null; });
  play.musicApplied = {};   // force the next step to re-sync the music cue
}
function pausePlayback() {
  play.playing = false;
  if (play.audio) play.audio.pause();
  stopMusic();
  play.musicApplied = {};
}
function exitPlayback() {
  pausePlayback();
  play.active = false;
  play.puppets = [];
  play.props = [];
  play.effects = [];
  play.audio = null;
  mode = play.returnTo || "stage";
}

/* Rebuild playback state at time t by re-applying events from the start.
   Event counts are small (sparse sampling), so a scrub re-scan is cheap. */
function seekPlayback(t) {
  t = clamp(t, 0, play.take.duration);
  play.puppets = [];
  play.props = [];
  play.effects = [];      // transient effects don't survive a scrub — fine
  play.bubbles = [];
  play.weather = "none";
  play.wipeAt = -1e9;
  // legacy takes carried one track with no music events — treat it as a cue
  // at t=0; newer takes set musicEv through their music events below
  if (play.take._hasMusicEv === undefined)
    play.take._hasMusicEv = play.take.events.some(e => e.type === "music");
  play.musicEv = (!play.take._hasMusicEv && play.take.trackData)
    ? { t: 0, trackData: play.take.trackData } : null;
  play.musicApplied = {};
  play.backdrop = live.backdrop;
  play.speakerId = -1;
  play.eventIdx = 0;
  play.ampIdx = 0;
  play.mouth.reset();
  play.t = t;
  play.ended = false;
  while (play.eventIdx < play.take.events.length && play.take.events[play.eventIdx].t <= t)
    applyEvent(play.take.events[play.eventIdx++]);
  updatePlaybackPositions(t, 0);
  if (play.audio) { try { play.audio.currentTime = t / 1000; } catch (e) {} }
}

function findPlayPuppet(id) {
  for (const p of play.puppets) if (p.id === id) return p;
  return null;
}

function applyEvent(ev) {
  switch (ev.type) {
    case "spawn": {
      const p = new Puppet(ev.spec, ev.x, ev.y, ev.id);
      p.facing = ev.facing || 1;
      play.puppets.push(p);
      break;
    }
    case "spawnProp": {
      play.props.push(new Prop(ev.propId, ev.x, ev.y, ev.id));
      break;
    }
    case "remove": {
      play.puppets = play.puppets.filter(p => p.id !== ev.id);
      play.props = play.props.filter(p => p.id !== ev.id);
      break;
    }
    case "pos": break;   // handled by keyframe interpolation
    case "layer": {
      const p = findEntity(play, ev.id);
      if (p) { p.layerMode = ev.mode; p.manualZ = ev.z || 0; }
      break;
    }
    case "backdrop": play.backdrop = ev.index; break;
    case "speaker": play.speakerId = ev.id; break;
    case "ability": {
      const p = findPlayPuppet(ev.id);
      if (p) spawnAbility(play, p);
      break;
    }
    case "interact": {
      // cosmetic only: state changes (ball arcs, nudges, removals) replay
      // through pos keyframes and remove events
      const v = findEntity(play, ev.pid);
      const p = findPlayPuppet(ev.id);
      if (p) p.useT = 260;
      if (v) propFX(play, v, ev.result);
      break;
    }
    case "board": {
      const p = findPlayPuppet(ev.id);
      if (p) p.vehicle = ev.vid;
      break;
    }
    case "unboard": {
      const p = findPlayPuppet(ev.id);
      if (p) p.vehicle = null;
      break;
    }
    case "bubble": {
      play.bubbles = play.bubbles.filter(b => b.id !== ev.id);
      play.bubbles.push({ id: ev.id, text: ev.text, until: ev.t + ev.dur });
      break;
    }
    case "weather": play.weather = ev.kind; break;
    case "wipe": play.wipeAt = ev.t; break;   // rendered from show-time
    case "music": play.musicEv = ev.trackData ? ev : null; break;
    case "expr": {
      const p = findPlayPuppet(ev.id);
      if (p) {
        // on a seek, only whatever of the expression window remains
        p.exprT = Math.max(0, EXPR_MS - (playbackClock() - ev.t));
        p.expression = p.exprT > 0 ? ev.kind : null;
      }
      break;
    }
  }
}

/* Interpolate between position keyframes, floor to integers at assignment,
   and feed the deltas into the same walk-cycle logic used live. */
function updatePlaybackPositions(t, dt) {
  for (const p of [...play.puppets, ...play.props]) {
    const kf = play.take.keyframes.get(p.id);
    if (!kf || !kf.length) continue;
    let a = kf[0], b = kf[kf.length - 1];
    for (let i = 0; i < kf.length; i++) {
      if (kf[i].t <= t) a = kf[i];
      if (kf[i].t >= t) { b = kf[i]; break; }
    }
    const span = b.t - a.t;
    const f = span > 0 ? clamp((t - a.t) / span, 0, 1) : 0;
    const nx = lerp(a.x, b.x, f), ny = lerp(a.y, b.y, f);
    const dx = nx - p.fx;
    if (dx > 0.05) p.facing = 1; else if (dx < -0.05) p.facing = -1;
    p.setPos(nx, ny);
    if (p.isProp) { p.animT += dt; p.wheelPhase += Math.abs(dx) * 0.25; if (p.wobbleT > 0) p.wobbleT -= dt; }
    else p.animate(dt, p.vehicle ? 0 : dx);   // no walk cycle while riding
  }
  // a boarded puppet's facing follows its vehicle
  for (const p of play.puppets) {
    if (!p.vehicle) continue;
    const v = findEntity(play, p.vehicle);
    if (v) p.facing = v.facing;
  }
}

function currentAmp(t) {
  const amps = play.take.amps;
  if (!amps.length) return 0;
  while (play.ampIdx < amps.length - 1 && amps[play.ampIdx + 1][0] <= t) play.ampIdx++;
  while (play.ampIdx > 0 && amps[play.ampIdx][0] > t) play.ampIdx--;
  return amps[play.ampIdx][1];
}

/* Advance playback by one fixed step. Shared by playback mode and export. */
function stepPlayback(dt) {
  if (!play.playing) return;
  if (!play.audio || play.audio.ended) play.t += dt;
  else play.t = play.audio.currentTime * 1000;   // stay synced for takeover
  const t = playbackClock();
  while (play.eventIdx < play.take.events.length && play.take.events[play.eventIdx].t <= t)
    applyEvent(play.take.events[play.eventIdx++]);
  updatePlaybackPositions(t, dt);
  // music cue changes (or a resume/seek) restart the synth mid-pattern
  if (play.musicEv !== play.musicApplied) {
    play.musicApplied = play.musicEv;
    const mev = play.musicEv;
    if (mev && mev.trackData)
      playTrack(mev.trackData, { offsetMs: Math.max(0, t - mev.t), outs: play.musicOuts || undefined });
    else stopMusic();
  }
  const amp = currentAmp(t);
  const jaw = play.mouth.update(amp, dt);
  for (const p of play.puppets) p.jaw = (p.id === play.speakerId) ? jaw : 0;
  duckMusic(jaw > 0);
  updateEffects(play, dt);
  if (t >= play.take.duration) {
    play.playing = false;
    play.ended = true;
    if (play.audio) play.audio.pause();
    if (play.exporting) finishExport();
    else stopMusic();
  }
}
/* ============================================================================
   VIDEO EXPORT — plays the timeline from the start (never re-performing the
   show) while capturing an export canvas sized to an exact integer multiple
   of 320x180 (4x = 1280x720, so the file contains no resampling).

   Frame pacing: the canvas stream is created with captureStream(0) and every
   frame is pushed explicitly with requestFrame() on an even 30fps grid of
   SHOW time — never "whenever rAF happened to fire". Irregular canvas-capture
   timestamps are the classic cause of exported video that stutters and
   freezes in players; explicit pacing removes it at the source. A tiny Web
   Worker metronome (workers are exempt from background-tab timer throttling)
   keeps the whole export loop running even when the window loses focus, so
   the picture can no longer freeze while the audio track runs on.
   ==========================================================================*/

const EXPORT_SCALE = 4;
const EXPORT_FPS = 30;
let exporter = null;   // {canvas, ctx, recorder, chunks, audio, mimeType, ...}

/* An interval that keeps firing in background tabs (falls back to a plain
   setInterval when Workers/blob URLs are unavailable). */
function makeTicker(cb, ms) {
  try {
    const src = "setInterval(function(){postMessage(0)}," + ms + ");";
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: "application/javascript" })));
    w.onmessage = cb;
    return { stop: () => w.terminate() };
  } catch (e) {
    const id = setInterval(cb, ms);
    return { stop: () => clearInterval(id) };
  }
}

/* Container preference: MP4 with H.264+AAC first (plays everywhere, including
   QuickTime/iMovie — an .m4v is this same container renamed), then webm. */
const EXPORT_FORMATS = [
  ["video/mp4;codecs=avc1.640028,mp4a.40.2", "mp4"],
  ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "mp4"],
  ["video/mp4", "mp4"],
  ["video/webm;codecs=vp9,opus", "webm"],
  ["video/webm", "webm"]
];

function startExport(t, returnTo, isRetry) {
  if (!t || exporter) return;
  const [cv, cx] = makeCanvas(IW * EXPORT_SCALE, IH * EXPORT_SCALE);
  let mimeType = "", ext = "webm";
  if (window.MediaRecorder) {
    // A retry after an empty result skips MP4: some browsers claim mp4
    // support but silently encode nothing, and webm always works.
    const candidates = isRetry ? EXPORT_FORMATS.filter(f => f[1] === "webm") : EXPORT_FORMATS;
    for (const [mt, ex2] of candidates) {
      if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; ext = ex2; break; }
    }
    if (!mimeType) return;
  } else {
    return; // no MediaRecorder: export unavailable
  }
  if (!isRetry) toast(ext === "mp4" ? "EXPORTING MP4..." : "EXPORTING WEBM (THIS BROWSER CAN'T WRITE MP4)");
  // Explicit frame pushing when the browser supports it, auto-30fps otherwise.
  let stream = cv.captureStream(0);
  const vtrack = stream.getVideoTracks()[0];
  let reqFrame = null;
  if (vtrack && typeof vtrack.requestFrame === "function") reqFrame = () => vtrack.requestFrame();
  else if (typeof stream.requestFrame === "function") reqFrame = () => stream.requestFrame();
  else stream = cv.captureStream(30);
  const hasMusic = !!t.trackData || t.events.some(e => e.type === "music" && e.trackData);
  let audioEl = null, dest = null;
  if (t.audioURL || hasMusic) {
    const ctx = audioCtx();
    dest = ctx.createMediaStreamDestination();
    for (const tr of dest.stream.getAudioTracks()) stream.addTrack(tr);
  }
  if (t.audioURL) {
    // Fresh element each export: a MediaElementSource permanently claims its
    // element. Routed ONLY to the destination node, so exporting is silent.
    audioEl = new Audio(t.audioURL);
    const src = audioCtx().createMediaElementSource(audioEl);
    src.connect(dest);
  }
  const recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 });
  const ex = { canvas: cv, ctx: cx, recorder, chunks: [], audio: audioEl, mimeType, ext,
               reqFrame, lastCapMs: -1e9, finishing: false,
               take: t, returnTo: returnTo || "stage", isRetry: !!isRetry };
  exporter = ex;
  recorder.ondataavailable = (e) => { if (e.data.size) ex.chunks.push(e.data); };
  recorder.onstop = () => deliverExport(ex);

  // Drive the shared playback machinery with the export flag set.
  stopMusic();               // a live cue doesn't bleed into the file
  mode = "export";
  play.take = t;
  play.returnTo = ex.returnTo;
  play.active = true;
  play.exporting = true;
  play.musicOuts = dest ? [dest] : null;   // music cues mix into the file, silently
  play.audio = audioEl;
  seekPlayback(0);
  play.playing = true;
  play.ended = false;
  if (audioEl) audioEl.play().catch(() => { play.audio = null; });
  recorder.start(1000);
  // Worker metronome: keeps the export loop stepping at full speed even when
  // the tab is backgrounded (page timers get throttled to 1Hz; workers don't).
  // When rAF is running normally the metronome sees fresh ticks and stays out
  // of the way.
  ex.ticker = makeTicker(() => {
    if (exporter !== ex) return;
    const now = performance.now();
    if (now - lastTickAt > 25) runFrame(now);
  }, 16);
}

/* Push one export frame: blit the clean 320x180 up to the export canvas
   (integer 4x) and hand it to the encoder — at most once per 1/30s of SHOW
   time, so the file's frame timestamps land on an even 30fps grid. */
function captureExportFrame(force) {
  if (!exporter) return;
  const t = playbackClock();
  if (!force && t - exporter.lastCapMs < 1000 / EXPORT_FPS - 1) return;
  exporter.lastCapMs = t;
  exporter.ctx.drawImage(screen, 0, 0, IW * EXPORT_SCALE, IH * EXPORT_SCALE);
  if (exporter.reqFrame) exporter.reqFrame();
}

function finishExport() {
  if (!exporter || exporter.finishing) return;
  exporter.finishing = true;
  captureExportFrame(true);              // make sure the last frame lands
  const ex = exporter;
  setTimeout(() => { if (ex.recorder.state !== "inactive") ex.recorder.stop(); }, 150);
}

function cancelExport() {
  if (!exporter) return;
  exporter.canceled = true;
  if (exporter.recorder.state !== "inactive") exporter.recorder.stop();
}

function deliverExport(ex) {
  if (ex && ex.ticker) ex.ticker.stop();
  if (exporter === ex) exporter = null;
  stopMusic();
  play.active = false;
  play.exporting = false;
  play.puppets = [];
  play.audio = null;
  mode = (ex && ex.returnTo) || "stage";
  if (!ex || ex.canceled) return;
  if (!ex.chunks.length) {
    // The very first canvas encoder in a session can come up empty on some
    // machines; one automatic retry is almost always enough.
    if (!ex.isRetry) { toast("EXPORT HICCUP - RETRYING..."); startExport(ex.take, ex.returnTo, true); }
    else toast("EXPORT FAILED - PLEASE TRY AGAIN");
    return;
  }
  const blob = new Blob(ex.chunks, { type: ex.mimeType || "video/webm" });
  const url = URL.createObjectURL(blob);
  const fname = "puppet-show." + (ex.ext || "webm");
  const a = document.createElement("a");
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // inline review player
  const overlay = document.getElementById("reviewOverlay");
  const video = document.getElementById("reviewVideo");
  video.src = url;
  overlay.classList.add("open");
  const closeBtn = document.getElementById("closeReviewBtn");
  const saveBtn = document.getElementById("saveAgainBtn");
  closeBtn.replaceChildren(makeTextCanvas("CLOSE", WHITE, 2));
  saveBtn.replaceChildren(makeTextCanvas("SAVE FILE", WHITE, 2));
  closeBtn.onclick = () => { overlay.classList.remove("open"); video.pause(); };
  saveBtn.onclick = () => {
    const a2 = document.createElement("a");
    a2.href = url; a2.download = fname;
    document.body.appendChild(a2); a2.click(); a2.remove();
  };
  toast("SAVED " + fname.toUpperCase());
}
/* ============================================================================
   ROSTER + PERSISTENCE — characters are saved as JSON only: slot ids and
   palette index mappings, never image data. Auto-saves to localStorage when
   available; falls back cleanly to in-memory only. Explicit Export/Import
   buttons download/read back a .json file.
   ==========================================================================*/

function makeSpec(name, slots, colors) {
  return {
    name,
    slots: Object.assign({ head: "round", hair: "none", hat: "none", face: "dot",
                           torso: "tee", arms: "short", legs: "pants", shoes: "sneaker",
                           item: "none" }, slots),
    colors: Object.assign({ skin: SAND, hair: DUSK, hat: BLUE, torso: BLUE,
                            arms: BLUE, legs: NAVY, shoes: DUSK, item: BLUE }, colors)
  };
}

function princessSpec() {
  return makeSpec("PRINCESS", { head: "egg", hair: "long", hat: "crown", face: "big",
                                torso: "gown", arms: "robe", legs: "bare", shoes: "heel", item: "none" },
                  { skin: WHITE, hair: SAND, hat: SAND, torso: RED, arms: RED, shoes: SAND });
}

/* Five pre-built characters. */
function prebuiltRoster() {
  return [
    princessSpec(),
    makeSpec("SIR BLOO", { hat: "helmet", torso: "armor", arms: "armor", legs: "armor", shoes: "boot", item: "sword", face: "dot" },
             { hat: SILVER, torso: SKY, arms: SKY, legs: SLATE, shoes: DUSK, item: BLUE }),
    makeSpec("MERLA", { hat: "wizard", hair: "long", torso: "dress", arms: "robe", legs: "pants", shoes: "boot", item: "staff", face: "big", head: "egg" },
             { hat: PLUM, hair: WHITE, torso: PLUM, arms: PLUM, legs: DUSK, shoes: DUSK, item: BLUE, skin: SAND }),
    makeSpec("ZIP-7", { hat: "helmet", torso: "armor", arms: "long", legs: "armor", shoes: "boot", item: "flag", face: "shades", head: "square" },
             { hat: WHITE, torso: WHITE, arms: WHITE, legs: WHITE, shoes: RED, item: GREEN, skin: ORANGE }),
    makeSpec("PENNY", { hat: "cap", hair: "pony", torso: "overalls", arms: "short", legs: "shorts", shoes: "sneaker", item: "book", face: "freckle", head: "round" },
             { hat: RED, hair: ORANGE, torso: SKY, arms: SAND, legs: NAVY, shoes: WHITE, item: GREEN })
  ];
}

let roster = [];
const STORE_KEY = "pixelPuppetsRoster.v1";

function storageAvailable() {
  try {
    const t = "__pp_test__";
    window.localStorage.setItem(t, t);
    window.localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
}
const canStore = storageAvailable();

function saveRoster() {
  if (!canStore) return;
  try { window.localStorage.setItem(STORE_KEY, JSON.stringify({ version: 2, characters: roster })); }
  catch (e) { /* quota or privacy mode: stay in-memory */ }
}
function loadRoster() {
  if (canStore) {
    try {
      const raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.characters) && data.characters.length) {
          roster = data.characters.map(c => makeSpec(c.name || "PUPPET", c.slots || {}, c.colors || {}));
          // one-time upgrade: rosters saved before v2 gain the princess
          if ((data.version || 1) < 2) {
            if (!roster.some(c => c.slots.torso === "gown")) roster.unshift(princessSpec());
            saveRoster();
          }
          return;
        }
      }
    } catch (e) { /* corrupted store: fall through to defaults */ }
  }
  roster = prebuiltRoster();
  saveRoster();
}

function exportRosterFile() {
  const blob = new Blob([JSON.stringify({ version: 1, characters: roster }, null, 2)],
                       { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "pixel-puppets-roster.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function importRosterFile() {
  const input = document.getElementById("importFile");
  input.onchange = () => {
    const file = input.files && input.files[0];
    input.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const chars = Array.isArray(data) ? data : data.characters;
        if (Array.isArray(chars) && chars.length) {
          roster = chars.map(c => makeSpec(c.name || "PUPPET", c.slots || {}, c.colors || {}));
          saveRoster();
          toast("ROSTER IMPORTED: " + roster.length + " PUPPETS");
        } else toast("NOT A ROSTER FILE");
      } catch (e) { toast("COULD NOT READ FILE"); }
    };
    reader.readAsText(file);
  };
  input.click();
}
/* ============================================================================
   SHOW LIBRARY — saved shows persist in IndexedDB (which stores the narration
   audio Blob natively alongside the timeline JSON). If IndexedDB is missing
   or blocked, the library falls back cleanly to in-memory for the session.
   A stored show record:
     { id, name, date, duration, events, amps, audioBlob }
   ==========================================================================*/

const showStore = { db: null, mem: [], nextMemId: 1 };
let showLib = [];              // cache of records for the library screen

function initShowStore() {
  try {
    if (!window.indexedDB) return refreshShowLib();
    const rq = indexedDB.open("pixelPuppetsShows", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("shows", { keyPath: "id", autoIncrement: true });
    rq.onsuccess = () => { showStore.db = rq.result; refreshShowLib(); };
    rq.onerror = () => refreshShowLib();
  } catch (e) { refreshShowLib(); }
}

function refreshShowLib(then) {
  if (!showStore.db) {
    showLib = showStore.mem.slice().reverse();
    if (then) then();
    return;
  }
  try {
    const rq = showStore.db.transaction("shows", "readonly").objectStore("shows").getAll();
    rq.onsuccess = () => { showLib = (rq.result || []).reverse(); if (then) then(); };
    rq.onerror = () => { showLib = []; if (then) then(); };
  } catch (e) { showLib = []; if (then) then(); }
}

function saveCurrentShow() {
  if (!take || take.saved) return;
  const d = new Date();
  const rec = {
    name: "",   // filled below once the id is known
    title: take.title || "",
    trackData: take.trackData || null,
    date: (d.getMonth() + 1) + "/" + d.getDate(),
    duration: take.duration,
    events: take.events,
    amps: take.amps,
    audioBlob: take.audioBlob
  };
  take.saved = true;
  if (showStore.db) {
    try {
      const store = showStore.db.transaction("shows", "readwrite").objectStore("shows");
      const rq = store.add(rec);
      rq.onsuccess = () => {
        rec.id = rq.result;
        rec.name = "SHOW " + rec.id;
        // write the record back with its generated name
        showStore.db.transaction("shows", "readwrite").objectStore("shows").put(rec);
        refreshShowLib();
        toast("SAVED TO LIBRARY AS " + rec.name);
      };
      rq.onerror = () => { take.saved = false; toast("COULD NOT SAVE SHOW"); };
      return;
    } catch (e) { /* fall through to memory */ }
  }
  rec.id = showStore.nextMemId++;
  rec.name = "SHOW " + rec.id;
  showStore.mem.push(rec);
  refreshShowLib();
  toast("SAVED (THIS SESSION ONLY - NO STORAGE)");
}

function deleteShowFromLib(id) {
  if (showStore.db) {
    try {
      const rq = showStore.db.transaction("shows", "readwrite").objectStore("shows").delete(id);
      rq.onsuccess = () => refreshShowLib();
      return;
    } catch (e) { /* fall through */ }
  }
  showStore.mem = showStore.mem.filter(r => r.id !== id);
  refreshShowLib();
}

/* Build a playable take from a stored record (cached per record per session
   so object URLs aren't recreated on every press). */
function takeFromRecord(rec) {
  if (rec._take) return rec._take;
  rec._take = {
    duration: rec.duration,
    title: rec.title || "",
    trackData: rec.trackData || null,
    events: rec.events,
    amps: rec.amps,
    audioBlob: rec.audioBlob || null,
    audioURL: rec.audioBlob ? URL.createObjectURL(rec.audioBlob) : null,
    keyframes: buildKeyframes(rec.events),
    saved: true
  };
  return rec._take;
}
/* ============================================================================
   CHARACTER BUILDER — assemble a character from costume slots. Every option
   is recolored by remapping palette indices (see remapFor); the preview is a
   real Puppet walking in place with the mouth cycling, so what you see is
   exactly what performs.
   ==========================================================================*/

const builder = {
  spec: null,          // spec being edited
  preview: null,       // Puppet instance for the live preview
  editIndex: -1,       // roster index being edited, -1 = new character
  jawT: 0,
  dirty: false
};

function rebuildPreview() {
  const b = builder;
  b.preview = new Puppet(b.spec, 0, 0, 0);
  b.preview.facing = 1;
}

function enterBuilder(rosterIndex) {
  builder.returnTo = (mode === "title") ? "title" : "stage";
  mode = "builder";
  builder.editIndex = rosterIndex;
  builder.spec = rosterIndex >= 0
    ? JSON.parse(JSON.stringify(roster[rosterIndex]))
    : makeSpec("PUPPET " + (roster.length + 1), {}, {});
  builder.dirty = false;
  rebuildPreview();
}

function exitBuilder() { textInput = null; titleParade = []; mode = builder.returnTo || "stage"; if (mode === "title") enterTitle(); }

function builderSave() {
  const b = builder;
  if (!b.spec.name.trim()) b.spec.name = "PUPPET";
  if (b.editIndex >= 0) roster[b.editIndex] = JSON.parse(JSON.stringify(b.spec));
  else { roster.push(JSON.parse(JSON.stringify(b.spec))); b.editIndex = roster.length - 1; }
  saveRoster();
  toast("SAVED " + b.spec.name);
  b.dirty = false;
}

function builderDelete() {
  if (builder.editIndex >= 0) {
    roster.splice(builder.editIndex, 1);
    saveRoster();
    toast("DELETED");
  }
  exitBuilder();
}

function cycleOption(slotDef, dir) {
  const cur = builder.spec.slots[slotDef.slot];
  let i = slotDef.options.findIndex(o => o.id === cur);
  i = (i + dir + slotDef.options.length) % slotDef.options.length;
  builder.spec.slots[slotDef.slot] = slotDef.options[i].id;
  builder.dirty = true;
  rebuildPreview();
}
function cycleColor(key, dir) {
  builder.spec.colors[key] = ((builder.spec.colors[key] || 0) + dir + 16) % 16;
  builder.dirty = true;
  rebuildPreview();
}

/* Builder screen renderer + UI registration (immediate mode). */
function renderBuilder(ctx, dt) {
  const b = builder;
  rect(ctx, 0, 0, IW, IH, NAVY);
  rect(ctx, 0, 0, IW, 14, NIGHT);
  drawTextC(ctx, "CHARACTER BUILDER", IW / 2, 0, WHITE, 2);

  // ---- live preview ----
  panel(ctx, 10, 22, 92, 104, DUSK, SILVER);
  rect(ctx, 11, 104, 90, 21, SLATE);   // floor band
  const pv = b.preview;
  pv.setPos(56, 112);
  // walk in place + demo mouth
  pv.walkPhase += 0.12;
  pv.walkIdx = Math.floor(pv.walkPhase) % WALK_SEQ.length;
  pv.moving = true;
  pv.breathT += dt; pv.blinkT -= dt;
  if (pv.blinkT <= 0) { pv.blinkHold = 140; pv.blinkT = 2200; }
  if (pv.blinkHold > 0) pv.blinkHold -= dt;
  b.jawT += dt;
  pv.jaw = [0, 1, 2, 1][Math.floor(b.jawT / 260) % 4];
  drawPuppet(ctx, pv, { clean: true });

  // name box (canvas text input, still bitmap font)
  const nameFocused = textInput && textInput.tag === "name";
  panel(ctx, 10, 132, 92, 13, nameFocused ? SLATE : DUSK, nameFocused ? ICE : SILVER);
  drawText(ctx, b.spec.name + (nameFocused && (Math.floor(performance.now() / 400) % 2) ? "_" : ""), 14, 135, WHITE);
  uiBtn(10, 132, 92, 13, () => {
    textInput = { tag: "name", max: 12, get: () => builder.spec.name, set: (v) => { builder.spec.name = v; builder.dirty = true; } };
  });

  // ---- slot rows ----
  let y = 22;
  for (const sd of SLOT_DEFS) {
    drawText(ctx, sd.label, 110, y + 2, SILVER);
    // option cycler
    const cur = optionById(sd.options, b.spec.slots[sd.slot]);
    panel(ctx, 148, y, 9, 11, NAVY, SILVER); drawText(ctx, "<", 151, y + 2, WHITE);
    uiBtn(148, y, 9, 11, () => cycleOption(sd, -1));
    rect(ctx, 158, y, 74, 11, DUSK);
    drawTextC(ctx, cur.name, 195, y + 2, WHITE);
    panel(ctx, 233, y, 9, 11, NAVY, SILVER); drawText(ctx, ">", 236, y + 2, WHITE);
    uiBtn(233, y, 9, 11, () => cycleOption(sd, 1));
    // color cycler
    if (sd.colorable) {
      panel(ctx, 248, y, 9, 11, NAVY, SILVER); drawText(ctx, "<", 251, y + 2, WHITE);
      uiBtn(248, y, 9, 11, () => cycleColor(sd.slot, -1));
      rect(ctx, 259, y + 1, 12, 9, b.spec.colors[sd.slot]);
      frameRect(ctx, 259, y + 1, 12, 9, NIGHT);
      panel(ctx, 273, y, 9, 11, NAVY, SILVER); drawText(ctx, ">", 276, y + 2, WHITE);
      uiBtn(273, y, 9, 11, () => cycleColor(sd.slot, 1));
    }
    y += 13;
  }
  // skin color row
  drawText(ctx, "SKIN", 110, y + 2, SILVER);
  panel(ctx, 248, y, 9, 11, NAVY, SILVER); drawText(ctx, "<", 251, y + 2, WHITE);
  uiBtn(248, y, 9, 11, () => cycleColor("skin", -1));
  rect(ctx, 259, y + 1, 12, 9, b.spec.colors.skin);
  frameRect(ctx, 259, y + 1, 12, 9, NIGHT);
  panel(ctx, 273, y, 9, 11, NAVY, SILVER); drawText(ctx, ">", 276, y + 2, WHITE);
  uiBtn(273, y, 9, 11, () => cycleColor("skin", 1));

  // ---- bottom buttons ----
  const buttons = [
    ["SAVE", () => { builderSave(); }],
    ["SAVE AS NEW", () => { builder.editIndex = -1; builderSave(); }],
    ["DELETE", () => builderDelete()],
    ["EXPORT JSON", () => exportRosterFile()],
    ["IMPORT", () => importRosterFile()],
    ["BACK", () => exitBuilder()]
  ];
  let bx = 10;
  for (const [label, cb] of buttons) {
    const w = textW(label) + 8;
    panel(ctx, bx, 160, w, 13, NIGHT, SILVER);
    drawText(ctx, label, bx + 4, 163, WHITE);
    uiBtn(bx, 160, w, 13, cb);
    bx += w + 5;
  }
  drawText(ctx, canStore ? "AUTO-SAVE ON" : "NO BROWSER STORAGE - USE EXPORT", 110, 150, SILVER);
}
/* ============================================================================
   MUSIC STUDIO — a step-sequencer screen for the chiptune tracks. Pick a
   track on the left, paint notes on the 32-step grid, preview it, and save.
   Built-in tracks can be edited and saved as copies; custom tracks persist
   to localStorage. "USE" marks the track that plays under the next show.
   ==========================================================================*/

const musicEd = {
  track: null,        // working copy being edited
  sourceId: null,     // id it was loaded from
  previewing: false,
  returnTo: "title"
};

function enterMusicEd() {
  musicEd.returnTo = (mode === "stage") ? "stage" : "title";
  mode = "music";
  if (!musicEd.track) musicEdLoad(allTracks()[0].id);
}
function exitMusicEd() {
  if (musicEd.previewing) { stopMusic(); musicEd.previewing = false; }
  textInput = null;
  mode = musicEd.returnTo;
  if (mode === "title") enterTitle();
}
function musicEdLoad(id) {
  const t = trackById(id);
  musicEd.track = JSON.parse(JSON.stringify(t));
  musicEd.sourceId = id;
  if (musicEd.previewing) { stopMusic(); musicEd.previewing = false; }
}
function musicEdSave() {
  const t = musicEd.track;
  const src = trackById(musicEd.sourceId);
  if (src && !src.builtin) {                    // overwrite the custom track
    Object.assign(src, JSON.parse(JSON.stringify(t)), { builtin: false });
  } else {                                      // save a new custom track
    const id = "custom" + Date.now();
    const copy = Object.assign(JSON.parse(JSON.stringify(t)), { id, builtin: false });
    if (src && src.builtin && copy.name === src.name) copy.name = (copy.name + " 2").slice(0, 14);
    customTracks.push(copy);
    musicEd.sourceId = id;
    musicEd.track.id = id;
  }
  saveTracks();
  toast("TRACK SAVED");
}

const MG = { x0: 78, y0: 26, cw: 7, ch: 8 };    // grid layout

function renderMusicEd(ctx) {
  rect(ctx, 0, 0, IW, IH, NAVY);
  rect(ctx, 0, 0, IW, 14, NIGHT);
  drawTextC(ctx, "MUSIC STUDIO", IW / 2, 0, WHITE, 2);
  panel(ctx, 2, 1, 32, 12, DUSK, SLATE);
  drawText(ctx, "BACK", 7, 4, WHITE);
  uiBtn(2, 1, 32, 12, () => exitMusicEd());
  const t = musicEd.track;
  if (!t) return;

  // ---- track list (left) ----
  let ly = 26;
  drawText(ctx, "TRACKS", 4, 18, SILVER);
  for (const tr of allTracks().slice(0, 9)) {
    const sel = tr.id === musicEd.sourceId;
    const used = tr.id === currentTrackId;
    panel(ctx, 2, ly, 42, 11, sel ? NAVY : DUSK, sel ? ICE : SLATE);
    drawText(ctx, tr.name.slice(0, 8), 4, ly + 2, sel ? WHITE : SILVER);
    uiBtn(2, ly, 42, 11, ((id) => () => musicEdLoad(id))(tr.id));
    panel(ctx, 45, ly, 12, 11, used ? GREEN : DUSK, used ? LIME : SLATE);
    drawTextC(ctx, used ? "*" : "+", 51, ly + 2, used ? WHITE : SILVER);
    uiBtn(45, ly, 12, 11, ((id, was) => () => {
      currentTrackId = was ? null : id;
      saveTracks();
      toast(was ? "MUSIC OFF FOR NEXT SHOW" : "WILL PLAY UNDER THE NEXT SHOW");
    })(tr.id, used));
    ly += 12;
  }
  drawText(ctx, "* = PLAYS IN", 2, ly + 2, SILVER);
  drawText(ctx, "NEXT SHOW", 2, ly + 10, SILVER);

  // ---- step grid ----
  for (let row = 0; row < MUSIC_ROWS; row++) {
    const label = row === ROW_KICK ? "KCK" : row === ROW_HAT ? "HAT" : NOTE_NAMES[row];
    drawText(ctx, label, MG.x0 - textW(label) - 3, MG.y0 + row * MG.ch + 1, row >= ROW_KICK ? ORANGE : SILVER);
    for (let s = 0; s < MUSIC_STEPS; s++) {
      const cx = MG.x0 + s * MG.cw, cy = MG.y0 + row * MG.ch;
      const beat = (s % 8) < 1, bar = (s % 4) < 1;
      const bg = t.grid[row][s] ? (row >= ROW_KICK ? ORANGE : SKY)
                                : beat ? SLATE : bar ? DUSK : NIGHT;
      rect(ctx, cx, cy, MG.cw - 1, MG.ch - 1, bg);
    }
  }
  // playhead while previewing
  if (musicEd.previewing && music.playing) {
    const mp = music.playing;
    const ctxNow = mic.ctx ? mic.ctx.currentTime : 0;
    const s = Math.max(0, Math.floor((ctxNow - mp.startTime) / mp.stepDur)) % MUSIC_STEPS;
    frameRect(ctx, MG.x0 + s * MG.cw - 1, MG.y0 - 1, MG.cw + 1, MUSIC_ROWS * MG.ch + 1, WHITE);
  }
  uiBtn(MG.x0, MG.y0, MUSIC_STEPS * MG.cw, MUSIC_ROWS * MG.ch, (mx2, my2) => {
    const s = Math.floor((mx2 - MG.x0) / MG.cw), row = Math.floor((my2 - MG.y0) / MG.ch);
    if (s >= 0 && s < MUSIC_STEPS && row >= 0 && row < MUSIC_ROWS) {
      t.grid[row][s] = !t.grid[row][s];
      if (musicEd.previewing) { playTrack(t, {}); }   // restart with the edit
    }
  });

  // ---- controls ----
  const cy = MG.y0 + MUSIC_ROWS * MG.ch + 6;
  const nameFocused = textInput && textInput.tag === "trackname";
  panel(ctx, MG.x0, cy, 80, 12, nameFocused ? SLATE : DUSK, nameFocused ? ICE : SILVER);
  drawText(ctx, t.name + (nameFocused && (Math.floor(performance.now() / 400) % 2) ? "_" : ""), MG.x0 + 3, cy + 3, WHITE);
  uiBtn(MG.x0, cy, 80, 12, () => {
    textInput = { tag: "trackname", max: 14, get: () => t.name, set: (v) => { t.name = v; } };
  });
  let bx = MG.x0 + 84;
  const btns = [
    [musicEd.previewing ? "STOP" : "PLAY", () => {
      if (musicEd.previewing) { stopMusic(); musicEd.previewing = false; }
      else { audioCtx(); playTrack(t, {}); musicEd.previewing = true; }
    }],
    ["BPM-", () => { t.bpm = Math.max(50, t.bpm - 4); if (musicEd.previewing) playTrack(t, {}); }],
    [String(t.bpm), () => {}],
    ["BPM+", () => { t.bpm = Math.min(200, t.bpm + 4); if (musicEd.previewing) playTrack(t, {}); }],
    [t.wave === "triangle" ? "SOFT" : "CHIP", () => { t.wave = t.wave === "triangle" ? "square" : "triangle"; if (musicEd.previewing) playTrack(t, {}); }]
  ];
  for (const [label, cb] of btns) {
    const w = textW(label) + 6;
    panel(ctx, bx, cy, w, 12, DUSK, SLATE);
    drawText(ctx, label, bx + 3, cy + 3, WHITE);
    uiBtn(bx, cy, w, 12, cb);
    bx += w + 3;
  }
  // second control row
  const cy2 = cy + 15;
  bx = MG.x0;
  const src = trackById(musicEd.sourceId);
  const row2 = [
    [src && src.builtin ? "SAVE AS COPY" : "SAVE", () => musicEdSave()],
    ["NEW", () => {
      musicEd.track = { id: "new", name: "MY SONG", bpm: 110, wave: "square", grid: emptyGrid() };
      musicEd.sourceId = null;
      if (musicEd.previewing) { stopMusic(); musicEd.previewing = false; }
    }],
    ["CLEAR", () => { t.grid = emptyGrid(); if (musicEd.previewing) playTrack(t, {}); }]
  ];
  if (src && !src.builtin) row2.push(["DELETE", () => {
    customTracks = customTracks.filter(c => c.id !== src.id);
    if (currentTrackId === src.id) currentTrackId = null;
    saveTracks();
    musicEdLoad(allTracks()[0].id);
    toast("TRACK DELETED");
  }]);
  for (const [label, cb] of row2) {
    const w = textW(label) + 6;
    panel(ctx, bx, cy2, w, 12, NIGHT, SILVER);
    drawText(ctx, label, bx + 3, cy2 + 3, WHITE);
    uiBtn(bx, cy2, w, 12, cb);
    bx += w + 4;
  }
  drawText(ctx, "CLICK THE GRID TO PAINT NOTES", bx + 4, cy2 + 3, SILVER);
}
/* ============================================================================
   STAGE — live scene rendering, drawer, selection UI, transport, overlays.
   ==========================================================================*/

const live = { puppets: [], props: [], effects: [], bubbles: [], weather: "none",
               wipeAt: -1e9, pendingBackdrop: null, backdrop: 0 };
let selected = null;
let drawerOpen = true;
let drawerTab = "cast";   // "cast" | "props"
let helpOpen = false;
let zTopCounter = 1000, zBackCounter = -1000;
let toastMsg = null, toastT = 0;
function toast(msg) { toastMsg = msg; toastT = 2200; }

function spawnPuppet(spec, x, y) {
  const p = new Puppet(spec, x !== undefined ? x : 80 + Math.floor(Math.random() * 160),
                             y !== undefined ? y : 120 + Math.floor(Math.random() * 40));
  live.puppets.push(p);
  if (recording) recEvent({ type: "spawn", id: p.id, spec: p.spec, x: p.x, y: p.y, facing: p.facing });
  return p;
}
function spawnStageProp(propId, x, y) {
  const v = new Prop(propId, x !== undefined ? x : 100 + Math.floor(Math.random() * 120),
                             y !== undefined ? y : 125 + Math.floor(Math.random() * 40));
  live.props.push(v);
  if (recording) recEvent({ type: "spawnProp", id: v.id, propId: v.propId, x: v.x, y: v.y });
  return v;
}
function removePuppet(p) {
  if (p.isProp) {
    const d = driverOf(live, p);            // eject a driver before towing
    if (d) unboardVehicle(live, d);
    live.props = live.props.filter(q => q !== p);
  } else {
    if (p.vehicle) p.vehicle = null;
    live.puppets = live.puppets.filter(q => q !== p);
  }
  if (selected === p) selected = null;
  if (dragging && dragging.p === p) dragging = null;
  if (recording) recEvent({ type: "remove", id: p.id });
}
function setBackdrop(i) {
  live.backdrop = i;
  if (recording) recEvent({ type: "backdrop", index: i });
}
function setLayer(p, mode2, z) {
  p.layerMode = mode2; p.manualZ = z || 0;
  if (recording) recEvent({ type: "layer", id: p.id, mode: mode2, z: p.manualZ });
}
function setWeather(kind) {
  live.weather = kind;
  if (recording) recEvent({ type: "weather", kind });
}
/* SCENE+ during recording: wipe transition with the backdrop swap mid-wipe. */
function sceneWipe(nextIdx) {
  live.wipeAt = performance.now();
  if (recording) recEvent({ type: "wipe" });
  live.pendingBackdrop = { at: performance.now() + 350, idx: nextIdx };
}

/* Resolve who is speaking right now (live): held talk modifier of an assigned
   scheme wins (most recent press first); otherwise a dragged puppet; else nobody. */
function currentSpeaker() {
  for (let i = talkStack.length - 1; i >= 0; i--) {
    const name = talkStack[i];
    for (const p of live.puppets) if (p.scheme === name) return p;
  }
  if (dragging) return dragging.p;
  return null;
}

/* ---- Scene rendering (shared by live, playback and export) -------------- */
function renderScene(ctx, state, opts) {
  ctx.drawImage(BACKDROPS[state.backdrop].canvas, 0, 0);
  const sorted = sortStage([...state.puppets, ...(state.props || [])]);
  for (const p of sorted) {
    if (p.isProp) drawProp(ctx, p, state, opts);
    else if (!p.vehicle) drawPuppet(ctx, p, opts);   // drivers drawn by vehicle
  }
  if (state.effects) drawEffects(ctx, state);
  const now = opts.time !== undefined ? opts.time : performance.now();
  drawWeather(ctx, state.weather, now);
  drawBubbles(ctx, state, now);
  drawWipe(ctx, now - state.wipeAt);
  if (!opts.clean) {
    for (const p of sorted) {
      // controller badge (or its mirrored copy on a guest screen); hidden
      // during playback and export
      const label = p.isProp ? "" : (p.scheme ? SCHEMES[p.scheme].label : (p.netBadge || ""));
      if (label) {
        const w = textW(label) + 4;
        const bx = p.x - (w >> 1), by = p.bbox.y - 10;
        rect(ctx, bx, by, w, 9, NIGHT);
        drawText(ctx, label, bx + 2, by + 1, ICE);
      }
    }
    if (selected && (live.puppets.includes(selected) || live.props.includes(selected))) {
      const b = selected.bbox;
      dashRect(ctx, b.x - 1, b.y - 1, b.w + 2, b.h + 2, ICE, Math.floor(performance.now() / 120) & 7);
    }
  }
}

/* ---- Drawer ------------------------------------------------------------- */
const DRAWER_H = 44;
function renderDrawer(ctx) {
  const y0 = IH - DRAWER_H;
  if (!drawerOpen) {
    panel(ctx, IW - 46, IH - 10, 46, 10, NIGHT, SILVER);
    drawText(ctx, "ROSTER", IW - 42, IH - 8, WHITE);
    uiBtn(IW - 46, IH - 10, 46, 10, () => { drawerOpen = true; });
    return;
  }
  panel(ctx, 0, y0, IW, DRAWER_H, NIGHT, SILVER);
  // tabs: puppet roster / props+vehicles / weather fx
  for (const [tab, label, tx, tw] of [["cast", "PUPPETS", 4, 44], ["props", "PROPS", 50, 40], ["fx", "FX", 92, 22]]) {
    const on = drawerTab === tab;
    panel(ctx, tx, y0, tw, 10, on ? NAVY : NIGHT, on ? ICE : SLATE);
    drawTextC(ctx, label, tx + tw / 2, y0 + 2, on ? WHITE : SILVER);
    uiBtn(tx, y0, tw, 10, () => { drawerTab = tab; });
  }
  drawText(ctx, "CLICK TO ADD", 122, y0 + 2, SILVER);
  panel(ctx, IW - 34, y0, 34, 10, DUSK, SILVER);
  drawText(ctx, "HIDE", IW - 28, y0 + 2, WHITE);
  uiBtn(IW - 34, y0, 34, 10, () => { drawerOpen = false; });

  let x = 4;
  const cy = y0 + 11;
  if (drawerTab === "cast") {
    // roster cells: a mini live portrait of each character
    for (let i = 0; i < roster.length && x < IW - 110; i++) {
      const spec = roster[i];
      panel(ctx, x, cy, 26, 24, DUSK, SLATE);
      const mini = miniPortrait(spec);
      ctx.drawImage(mini, x + 1, cy + 1);
      uiBtn(x, cy, 26, 24, ((idx) => () => {
        const p = spawnPuppet(roster[idx]);
        selected = p;
        toast("ADDED " + roster[idx].name);
      })(i));
      if (!recording) {   // no costume edits mid-take
        panel(ctx, x, cy + 25, 26, 8, NAVY, SLATE);
        drawTextC(ctx, "EDIT", x + 13, cy + 26, WHITE);
        uiBtn(x, cy + 25, 26, 8, ((idx) => () => enterBuilder(idx))(i));
      }
      x += 28;
    }
    // new character cell
    if (!recording) {
      panel(ctx, x, cy, 26, 24, DUSK, SLATE);
      drawTextC(ctx, "+", x + 13, cy + 8, LIME);
      uiBtn(x, cy, 26, 33, () => enterBuilder(-1));
      panel(ctx, x, cy + 25, 26, 8, NAVY, SLATE);
      drawTextC(ctx, "NEW", x + 13, cy + 26, WHITE);
    }
  } else if (drawerTab === "fx") {
    // weather buttons — take effect immediately and record as events
    drawText(ctx, "WEATHER", 6, cy + 2, SILVER);
    let wx = 6;
    for (const [kind, label] of [["none", "CLEAR"], ["rain", "RAIN"], ["snow", "SNOW"], ["fireflies", "FIREFLIES"]]) {
      const on = live.weather === kind;
      const w = textW(label) + 8;
      panel(ctx, wx, cy + 10, w, 13, on ? NAVY : DUSK, on ? ICE : SLATE);
      drawText(ctx, label, wx + 4, cy + 13, on ? WHITE : SILVER);
      uiBtn(wx, cy + 10, w, 13, ((k) => () => { setWeather(k); })(kind));
      wx += w + 4;
    }
    drawText(ctx, "SCENE+ (TOP BAR) WIPES SCENES WHILE REC", 6, cy + 26, SILVER);
  } else {
    // props + vehicles
    for (const def of PROP_DEFS) {
      if (x + 22 > IW - 110) break;
      panel(ctx, x, cy, 22, 24, DUSK, SLATE);
      const s = sprite(def.frames[0], {});
      const fit = Math.min(1, Math.min(20 / s.w, 22 / s.h));
      const dw = Math.max(1, Math.floor(s.w * fit)), dh = Math.max(1, Math.floor(s.h * fit));
      ctx.drawImage(s.cv, x + 1 + ((20 - dw) >> 1), cy + 1 + ((22 - dh) >> 1), dw, dh);
      uiBtn(x, cy, 22, 24, ((id2) => () => {
        selected = spawnStageProp(id2);
        toast("ADDED " + id2.toUpperCase());
      })(def.id));
      panel(ctx, x, cy + 25, 22, 8, NAVY, SLATE);
      const short = def.vehicle ? (def.vehicle.seatOnly ? "SIT" : "RIDE") : "PROP";
      drawTextC(ctx, short, x + 11, cy + 26, def.vehicle ? ICE : SILVER);
      x += 23;
    }
  }

  // backdrop thumbnails (nearest-neighbor shrink of the scene canvases)
  drawText(ctx, "SCENE", IW - 104, y0 + 2, SILVER);
  for (let i = 0; i < BACKDROPS.length; i++) {
    const bx = IW - 104 + (i % 4) * 25, by = y0 + 11 + Math.floor(i / 4) * 16;
    ctx.drawImage(BACKDROPS[i].canvas, 0, 0, IW, IH, bx, by, 24, 14);
    frameRect(ctx, bx, by, 24, 14, live.backdrop === i ? ICE : SLATE);
    uiBtn(bx, by, 24, 14, ((idx) => () => setBackdrop(idx))(i));
  }
}

/* Mini portrait: head+torso of a character rendered once into a 24x22 canvas. */
const portraitCache = new Map();
function miniPortrait(spec) {
  const key = JSON.stringify(spec);
  let cv = portraitCache.get(key);
  if (cv) return cv;
  const [c, cx] = makeCanvas(24, 22);
  const p = new Puppet(spec, 12, 40, 0);   // feet below the canvas: shows head+torso
  drawPuppet(cx, p, { clean: true });
  portraitCache.set(key, c);
  return c;
}

/* ---- Selection panel ---------------------------------------------------- */
function renderSelectionPanel(ctx) {
  if (!selected || !(live.puppets.includes(selected) || live.props.includes(selected))) return;
  const p = selected;
  const isProp = !!p.isProp;
  const x0 = IW - 78, y0 = 16;
  panel(ctx, x0, y0, 76, isProp ? 56 : 84, NIGHT, SILVER);
  drawTextC(ctx, isProp ? p.def.name : p.spec.name, x0 + 38, y0 + 2, SAND);
  let ry;
  if (!isProp && p.guest) {
    drawText(ctx, "PLAYER 2 (REMOTE)", x0 + 4, y0 + 13, LIME);
    ry = y0 + 24;
  } else if (!isProp) {
    drawText(ctx, "CONTROLS", x0 + 4, y0 + 11, SILVER);
    let bx = x0 + 4;
    for (const name of SCHEME_NAMES) {
      const on = p.scheme === name;
      const w = 33;
      panel(ctx, bx, y0 + 19, w, 11, on ? BLUE : DUSK, on ? ICE : SLATE);
      drawTextC(ctx, SCHEMES[name].label, bx + w / 2, y0 + 21, WHITE);
      uiBtn(bx, y0 + 19, w, 11, ((n, was) => () => {
        if (was) p.scheme = null; else assignScheme(live.puppets, p, n);
      })(name, on));
      bx += 35;
    }
    ry = y0 + 32;
  } else {
    ry = y0 + 12;
  }
  const rows = [
    ["BRING FORWARD", () => setLayer(p, "manual", ++zTopCounter)],
    ["SEND BACK", () => setLayer(p, "manual", --zBackCounter)],
    [p.layerMode === "auto" ? "DEPTH: AUTO" : "SET AUTO DEPTH", () => setLayer(p, "auto", 0)],
    ["REMOVE (DEL)", () => removePuppet(p)]
  ];
  if (!isProp) rows.push([p.vehicle ? "EXIT RIDE (SPC)" : "USE ITEM (SPC)", () => useAction(p)]);
  for (const [label, cb] of rows) {
    panel(ctx, x0 + 4, ry, 68, 9, DUSK, SLATE);
    drawTextC(ctx, label, x0 + 38, ry + 1, WHITE);
    uiBtn(x0 + 4, ry, 68, 9, cb);
    ry += 10;
  }
}

/* ---- Top bar ------------------------------------------------------------ */
function ccLabel() {
  if (!speech.enabled && speech.status !== "loading") return "CC:OFF";
  if (speech.status === "loading") return "CC " + speech.progress + "%";
  if (speech.status === "ready") return "CC:ON";
  return "CC:ERR";
}

function barRow(ctx, items, y) {
  let x = 2;
  for (const [label, cb, col] of items) {
    const w = textW(label) + 6;
    panel(ctx, x, y, w, 12, DUSK, col !== undefined ? col : SLATE);
    drawText(ctx, label, x + 3, y + 3, col !== undefined ? col : WHITE);
    uiBtn(x, y, w, 12, cb);
    x += w + 3;
  }
  return x;
}

function renderTopBar(ctx, speaker) {
  rect(ctx, 0, 0, IW, 14, NIGHT);
  const row1 = [];
  if (!recording) {
    row1.push(["MENU", () => enterTitle()]);
    row1.push(["BUILD", () => enterBuilder(-1)]);
    row1.push(["MUSIC", () => enterMusicEd()]);
    row1.push(["REC", () => { requestMic(); startRecording(); toast(mic.ok ? "RECORDING!" : "RECORDING (NO MIC - SILENT TAKE)"); }, RED]);
  } else {
    row1.push(["STOP REC", () => { stopRecording(); toast("TAKE READY - PRESS PLAY"); }, RED]);
    row1.push(["SCENE+", () => sceneWipe((live.backdrop + 1) % BACKDROPS.length), ICE]);
  }
  row1.push([ccLabel(), () => toggleSpeech(), speech.status === "ready" && speech.enabled ? LIME : SILVER]);
  row1.push(["?", () => { helpOpen = !helpOpen; }]);
  barRow(ctx, row1, 1);
  // second row: take controls
  if (take && !recording) {
    rect(ctx, 0, 14, IW, 14, NIGHT);
    barRow(ctx, [
      ["PLAY", () => enterPlayback(take, "stage"), LIME],
      ["EXPORT", () => startExport(take, "stage"), SKY],
      ["TITLE", () => openShowTitle(), SAND],
      !take.saved ? ["SAVE", () => saveCurrentShow(), SAND] : ["SAVED", () => {}, SLATE],
      ["DISCARD", () => { discardTake(); toast("TAKE DISCARDED"); }]
    ], 15);
  }
  // status, right-aligned
  if (recording) {
    const secs = Math.floor((performance.now() - recording.t0) / 1000);
    const label = "REC " + fmtTime(secs * 1000);
    if (Math.floor(performance.now() / 400) % 2) rect(ctx, IW - textW(label) - 14, 4, 6, 6, RED);
    drawTextR(ctx, label, IW - 4, 4, RED);
    frameRect(ctx, 0, 0, IW, IH, RED);
  } else if (net.hosting) {
    drawTextR(ctx, "ROOM " + net.code + (net.conn ? " - 2P" : " - WAITING"), IW - 4, 4, net.conn ? LIME : ICE);
  } else if (!mic.ok && mic.requested) {
    drawTextR(ctx, "NO MIC", IW - 4, 4, SILVER);
  }
  // current speaker indicator
  if (speaker) {
    const y = take && !recording ? 30 : 16;
    const label = "TALKING: " + speaker.spec.name;
    rect(ctx, 2, y, textW(label) + 6, 9, NIGHT);
    drawText(ctx, label, 5, y + 1, SAND);
  }
}

/* ---- show title input ---------------------------------------------------- */
const showTitle = { active: false, text: "" };
function openShowTitle() {
  if (!take) return;
  showTitle.active = true;
  showTitle.text = take.title || "";
  textInput = {
    tag: "showtitle", max: 24,
    get: () => showTitle.text,
    set: (v) => { showTitle.text = v; },
    onEnter: () => { showTitle.active = false; take.title = showTitle.text.trim(); take.saved = false; toast("TITLE SET"); },
    onCancel: () => { showTitle.active = false; }
  };
}
function renderShowTitleInput(ctx) {
  if (!showTitle.active) return;
  panel(ctx, 60, 60, 200, 32, NIGHT, SAND);
  drawText(ctx, "SHOW TITLE (ENTER TO SET):", 66, 64, SILVER);
  rect(ctx, 66, 74, 188, 12, DUSK);
  drawText(ctx, showTitle.text + ((Math.floor(performance.now() / 400) % 2) ? "_" : ""), 69, 77, WHITE);
}

/* ---- curtain + title card (playback and export only) --------------------
   The show starts behind a closing-to-opening theater curtain carrying the
   title card, and the curtain sweeps shut over the final moments.          */
function drawShowIntro(ctx, t, tk) {
  const D = tk.duration;
  const closeF = t > D - 700 ? clamp((t - (D - 700)) / 650, 0, 1) : 0;
  const openF = clamp((t - 500) / 900, 0, 1);
  const cover = Math.max(1 - openF, closeF);        // closed at start and end
  const half = Math.floor((IW / 2) * cover);
  if (half > 0) {
    for (const [x0, dir] of [[0, 1], [IW - half, -1]]) {
      rect(ctx, x0, 0, half, IH, RED);
      for (let i = 4; i < half; i += 8) rect(ctx, dir > 0 ? half - i : IW - half + i, 0, 3, IH, PLUM);
    }
  }
  if (half >= IW / 2 - 2 || t < 1600) {   // valance while mostly closed
    rect(ctx, 0, 0, IW, 10, RED);
    for (let x = 0; x < IW; x += 16) rect(ctx, x + 5, 10, 6, 3, RED);
    rect(ctx, 0, 0, IW, 2, SAND);
  }
  if (t < 1600) {                          // title card
    const title = (tk.title && tk.title.length) ? tk.title : "A PIXEL PUPPETS SHOW";
    drawTextC(ctx, title, IW / 2 + 1, 61, NIGHT, 2);
    drawTextC(ctx, title, IW / 2, 60, SAND, 2);
    drawTextC(ctx, "* PIXEL PUPPETS PRESENTS *", IW / 2, 46, WHITE);
